<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>嵌合体协议 - Chimera Protocol</title>
    <style>
        /* ================= 核心视觉系统 (赛博生物风) ================= */
        :root {
            --bg-dark: #0a0a0f; --bg-panel: #161620; --border: #2d2d44;
            --text-main: #e2e8f0; --text-muted: #64748b;
            --primary: #3b82f6; --primary-hover: #2563eb; --currency: #10b981;
            /* 稀有度色彩引擎 */
            --rarity-n: #94a3b8;   /* 灰 */
            --rarity-r: #3b82f6;   /* 蓝 */
            --rarity-sr: #a855f7;  /* 紫 */
            --rarity-ssr: #eab308; /* 金 */
            --rarity-ur: #ef4444;  /* 红 (终极融合) */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* 顶部资源条 */
        .header { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 10; }
        .currency-box { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: bold; background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.3); }
        .currency-icon { color: var(--currency); text-shadow: 0 0 10px var(--currency); }
        
        /* 页面容器与动画 */
        .view-container { flex: 1; position: relative; overflow: hidden; }
        .view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 20px; overflow-y: auto; opacity: 0; pointer-events: none; transition: 0.3s ease; transform: scale(0.98); }
        .view.active { opacity: 1; pointer-events: auto; transform: scale(1); }

        /* 抽卡区 (Gacha View) */
        #view-gacha { display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1a1a2e 0%, var(--bg-dark) 100%); }
        .banner-title { font-size: 2.5rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .pity-counter { color: var(--text-muted); margin-bottom: 40px; font-size: 0.9rem; }
        .pity-counter span { color: var(--rarity-ssr); font-weight: bold; }
        .gacha-actions { display: flex; gap: 20px; }
        .btn-gacha { background: var(--bg-panel); color: white; border: 2px solid var(--primary); padding: 15px 40px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); position: relative; overflow: hidden; }
        .btn-gacha::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: 0.5s; }
        .btn-gacha:hover { background: var(--primary); transform: translateY(-3px); box-shadow: 0 5px 25px rgba(59, 130, 246, 0.5); }
        .btn-gacha:hover::before { left: 100%; }
        .btn-gacha:active { transform: translateY(1px); }

        /* 抽卡结果动画弹窗 */
        #gacha-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .result-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; max-width: 800px; margin-top: 30px; }
        .card-reveal { width: 120px; height: 160px; background: #222; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #444; opacity: 0; transform: translateY(50px) scale(0.8); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card-reveal.show { opacity: 1; transform: translateY(0) scale(1); }
        
        /* 稀有度特效 */
        .rarity-N { border-color: var(--rarity-n); } .rarity-N::after { content:'N'; color: var(--rarity-n); }
        .rarity-R { border-color: var(--rarity-r); box-shadow: 0 0 15px rgba(59,130,246,0.3); } .rarity-R::after { content:'R'; color: var(--rarity-r); text-shadow: 0 0 5px var(--rarity-r); }
        .rarity-SR { border-color: var(--rarity-sr); box-shadow: 0 0 20px rgba(168,85,247,0.5); } .rarity-SR::after { content:'SR'; color: var(--rarity-sr); text-shadow: 0 0 8px var(--rarity-sr); }
        .rarity-SSR { border-color: var(--rarity-ssr); box-shadow: 0 0 30px rgba(234,179,8,0.6); animation: float 2s infinite ease-in-out; } .rarity-SSR::after { content:'SSR'; color: var(--rarity-ssr); text-shadow: 0 0 10px var(--rarity-ssr); }
        .rarity-UR { border-color: var(--rarity-ur); box-shadow: 0 0 40px rgba(239,68,68,0.8); animation: pulseRed 1.5s infinite; } .rarity-UR::after { content:'UR'; color: var(--rarity-ur); text-shadow: 0 0 15px var(--rarity-ur); }
        
        .card-reveal::after { position: absolute; top: 5px; left: 8px; font-weight: 900; font-size: 0.9rem; font-style: italic; }
        .cr-icon { font-size: 3rem; margin-bottom: 10px; z-index: 2; }
        .cr-name { font-weight: bold; font-size: 0.85rem; text-align: center; z-index: 2; background: rgba(0,0,0,0.6); padding: 2px 5px; border-radius: 4px;}
        
        /* 融合区 (Evolution View) */
        .evo-container { display: flex; gap: 20px; height: 100%; }
        .roster-panel { width: 350px; background: var(--bg-panel); border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .panel-title { padding: 15px; border-bottom: 1px solid var(--border); font-weight: bold; color: var(--text-muted); letter-spacing: 1px; }
        .roster-list { flex: 1; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; align-content: start; }
        
        /* 兵营小头像 */
        .unit-thumb { aspect-ratio: 1; border-radius: 8px; background: #222; border: 2px solid #444; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; position: relative; transition: 0.2s; }
        .unit-thumb:hover { transform: scale(1.05); }
        .unit-thumb.selected { border-color: white; box-shadow: 0 0 0 2px white; transform: scale(1.1); z-index: 5; }
        .unit-lvl { position: absolute; bottom: 2px; right: 4px; font-size: 0.7rem; font-weight: bold; background: rgba(0,0,0,0.8); padding: 0 3px; border-radius: 3px; }

        .fusion-panel { flex: 1; background: var(--bg-panel); border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .fusion-slots { display: flex; align-items: center; gap: 30px; margin-bottom: 40px; }
        .slot { width: 120px; height: 120px; border: 2px dashed var(--border); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 3rem; background: rgba(0,0,0,0.3); transition: 0.3s; }
        .slot.filled { border-style: solid; }
        .plus-sign { font-size: 2rem; color: var(--text-muted); font-weight: bold; }
        
        .btn-fuse { background: var(--rarity-sr); color: white; border: none; padding: 15px 50px; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 20px rgba(168,85,247,0.4); }
        .btn-fuse:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 8px 30px rgba(168,85,247,0.6); }
        .btn-fuse:disabled { background: #333; box-shadow: none; cursor: not-allowed; opacity: 0.5; }

        /* 战斗推图区 (Combat View) */
        .combat-stage { display: flex; flex-direction: column; height: 100%; gap: 15px; }
        .stage-info { text-align: center; font-size: 1.5rem; font-weight: bold; color: var(--currency); }
        .arena { flex: 1; background: url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h40v40H0V0zm20 20h20v20H20V20zM0 20h20v20H0V20z" fill="%231a1a2e" fill-opacity="0.4" fill-rule="evenodd"/></svg>'); border-radius: 12px; border: 1px solid var(--border); position: relative; overflow: hidden; display: flex; justify-content: space-between; padding: 20px; }
        .team-box { width: 45%; border-radius: 8px; padding: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
        .dmg-text { position: absolute; font-weight: bold; color: #ef4444; font-size: 1.2rem; text-shadow: 0 0 5px #000; animation: floatUpAndFade 0.8s forwards; pointer-events: none; }
        .dps-meter { background: var(--bg-panel); padding: 15px; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; font-family: monospace; font-size: 1.1rem; }

        /* 底部导航栏 */
        .nav-bar { display: flex; background: var(--bg-panel); border-top: 1px solid var(--border); z-index: 10; }
        .nav-item { flex: 1; padding: 15px; text-align: center; color: var(--text-muted); font-weight: bold; cursor: pointer; transition: 0.2s; border-bottom: 3px solid transparent; }
        .nav-item:hover { color: var(--text-main); background: rgba(255,255,255,0.02); }
        .nav-item.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(59, 130, 246, 0.05); }

        /* 动画关键帧 */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes pulseRed { 0% { box-shadow: 0 0 20px rgba(239,68,68,0.5); } 50% { box-shadow: 0 0 50px rgba(239,68,68,0.9); } 100% { box-shadow: 0 0 20px rgba(239,68,68,0.5); } }
        @keyframes floatUpAndFade { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-40px) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 900; font-size: 1.2rem; letter-spacing: 1px; color: white;">CHIMERA<span style="color:var(--primary);">OS</span></div>
        <div class="currency-box">
            <span class="currency-icon">🧬</span>
            <span id="ui-biomass">0</span>
        </div>
    </div>

    <div class="view-container">
        
        <div id="view-gacha" class="view active">
            <div class="banner-title">深渊基因库</div>
            <div class="pity-counter">距离必定获得 SSR 还有 <span id="ui-pity">50</span> 次</div>
            <div class="gacha-actions">
                <button class="btn-gacha" onclick="GachaSystem.pull(1)">单次提取 <br><span style="font-size:0.8rem;font-weight:normal;color:#aaa;">消耗 100 🧬</span></button>
                <button class="btn-gacha" onclick="GachaSystem.pull(10)" style="border-color:var(--rarity-ssr);">十连提取 <br><span style="font-size:0.8rem;font-weight:normal;color:#aaa;">消耗 1000 🧬</span></button>
            </div>
            
            <div style="margin-top: 50px; font-size: 0.8rem; color: #555; text-align: center; line-height: 1.6;">
                N级(60%) | R级(30%) | SR级(8%) | SSR级(2%)<br>
                最多50次未获得SSR，则下次必定触发保底。
            </div>
        </div>

        <div id="view-lab" class="view">
            <div class="evo-container">
                <div class="roster-panel">
                    <div class="panel-title">已收容嵌合体 (<span id="ui-roster-count">0</span>)</div>
                    <div class="roster-list" id="ui-roster">
                        </div>
                </div>
                <div class="fusion-panel">
                    <h2 style="position:absolute; top:20px; color:var(--text-muted); font-weight:300;">基因突变引擎</h2>
                    <div class="fusion-slots">
                        <div class="slot" id="slot-1" onclick="EvoSystem.clearSlot(1)"></div>
                        <div class="plus-sign">+</div>
                        <div class="slot" id="slot-2" onclick="EvoSystem.clearSlot(2)"></div>
                    </div>
                    <div style="height: 40px; margin-bottom: 20px; font-weight: bold; color: var(--rarity-ssr);" id="ui-fusion-preview">
                        </div>
                    <button class="btn-fuse" id="btn-fuse" disabled onclick="EvoSystem.executeFusion()">执行融合</button>
                    <p style="margin-top: 20px; font-size: 0.8rem; color: var(--text-muted);">
                        规则：两只同种且同级的生物可融合成更高等级。<br>
                        隐藏配方：特定种类融合可产生<span style="color:var(--rarity-ur)"> UR 神话生物</span>。
                    </p>
                </div>
            </div>
        </div>

        <div id="view-combat" class="view">
            <div class="combat-stage">
                <div class="stage-info">第 <span id="ui-stage">1</span> 扇区：荒芜原野</div>
                <div class="arena">
                    <div class="team-box" id="team-player" style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59,130,246,0.3);">
                        </div>
                    <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; opacity:0.5; font-weight:bold; font-size:2rem; font-style:italic;">VS</div>
                    <div class="team-box" id="team-enemy" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239,68,68,0.3);">
                        </div>
                </div>
                <div class="dps-meter">
                    <div>小队总战力：<span id="ui-power" style="color:var(--primary);">0</span></div>
                    <div>生物质产出效率：<span id="ui-bps" style="color:var(--currency);">+0.0/s</span></div>
                </div>
            </div>
        </div>

    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="UI.switchTab('gacha', this)">深渊抽取 (Gacha)</div>
        <div class="nav-item" onclick="UI.switchTab('lab', this)">进化实验 (Lab)</div>
        <div class="nav-item" onclick="UI.switchTab('combat', this)">异星征伐 (Combat)</div>
    </div>

    <div id="gacha-overlay" onclick="GachaSystem.closeResult()">
        <h2 style="color:white; margin-bottom: 20px; text-shadow: 0 0 10px #fff;">基因解析完成</h2>
        <div class="result-grid" id="gacha-results"></div>
        <div style="color: #666; margin-top: 40px; font-size: 0.9rem; animation: blink 2s infinite;">点击任意处继续</div>
    </div>

<script>
/**
 * 嵌合体协议 - 核心引擎
 * 采用数据驱动 (Data-Driven) 设计。只需在 DB 中添加数据即可无限扩展游戏内容。
 */

// ================= 1. 静态数据库 (Data Dictionary) =================
const DB = {
    rarityConfigs: {
        'N': { color: 'var(--rarity-n)', powerBase: 10,  produceBase: 1 },
        'R': { color: 'var(--rarity-r)', powerBase: 30,  produceBase: 4 },
        'SR': { color: 'var(--rarity-sr)', powerBase: 100, produceBase: 15 },
        'SSR':{ color: 'var(--rarity-ssr)',powerBase: 500, produceBase: 80 },
        'UR': { color: 'var(--rarity-ur)', powerBase: 2000,produceBase: 300 } // 仅靠隐藏融合获得
    },
    // 基础物种池 (用于抽卡)
    pool: [
        { id: 'slime', name: '酸性史莱姆', icon: '💧', rarity: 'N' },
        { id: 'rat',   name: '瘟疫鼠',     icon: '🐀', rarity: 'N' },
        { id: 'wolf',  name: '荒原狼',     icon: '🐺', rarity: 'R' },
        { id: 'bat',   name: '吸血蝠',     icon: '🦇', rarity: 'R' },
        { id: 'bear',  name: '狂暴装甲熊', icon: '🐻', rarity: 'SR' },
        { id: 'snake', name: '剧毒羽蛇',   icon: '🐍', rarity: 'SR' },
        { id: 'dragon',name: '黑龙幼崽',   icon: '🐉', rarity: 'SSR' },
        { id: 'angel', name: '堕落天使',   icon: '👼', rarity: 'SSR' }
    ],
    // 隐藏合成配方 (跨物种神话融合)
    recipes: {
        'dragon+angel': { id: 'bahamut', name: '巴哈姆特', icon: '✨', rarity: 'UR' },
        'bear+wolf':    { id: 'behemoth',name: '比蒙巨兽', icon: '👹', rarity: 'SSR' },
        'slime+rat':    { id: 'abom',    name: '憎恶体',   icon: '🧟', rarity: 'R' }
    }
};

// ================= 2. 玩家状态存储 (Save State) =================
const State = {
    biomass: 5000, // 初始给点钱爽一下
    roster: [],    // 存放实体对象: { uid, templateId, level }
    pityCount: 0,
    uidCounter: 0
};

// 工具方法：获取生物完整数据
function getUnitData(templateId) {
    let unit = DB.pool.find(u => u.id === templateId);
    if (!unit) {
        // 如果池子里没有，找找是不是隐藏合成的
        for(let key in DB.recipes) {
            if(DB.recipes[key].id === templateId) return DB.recipes[key];
        }
    }
    return unit;
}

// ================= 3. 抽卡系统 (Gacha Engine) =================
const GachaSystem = {
    pull(times) {
        let cost = times * 100;
        if (State.biomass < cost) {
            alert("生物质不足！请在推图界面挂机产出。");
            return;
        }
        State.biomass -= cost;
        UI.updateHeader();

        let results = [];
        for (let i = 0; i < times; i++) {
            results.push(this.rollSingle());
        }

        this.showResults(results);
    },

    rollSingle() {
        State.pityCount++;
        let roll = Math.random() * 100;
        let rarity = 'N';

        // 保底判定
        if (State.pityCount >= 50) {
            rarity = 'SSR';
            State.pityCount = 0; // 触发保底重置
        } else {
            // 真实爆率: SSR 2%, SR 8%, R 30%, N 60%
            if (roll <= 2) {
                rarity = 'SSR';
                State.pityCount = 0; // 欧皇出金，重置保底
            } else if (roll <= 10) {
                rarity = 'SR';
            } else if (roll <= 40) {
                rarity = 'R';
            }
        }

        // 从对应稀有度的池子中随机挑选
        let poolForRarity = DB.pool.filter(u => u.rarity === rarity);
        let pulledTemplate = poolForRarity[Math.floor(Math.random() * poolForRarity.length)];
        
        // 实体化并加入兵营
        let newUnit = {
            uid: ++State.uidCounter,
            templateId: pulledTemplate.id,
            level: 1
        };
        State.roster.push(newUnit);
        
        return pulledTemplate;
    },

    showResults(results) {
        const overlay = document.getElementById('gacha-overlay');
        const grid = document.getElementById('gacha-results');
        grid.innerHTML = '';
        overlay.style.display = 'flex';
        
        document.getElementById('ui-pity').innerText = 50 - State.pityCount;
        UI.renderRoster(); // 刷新背包
        CombatSystem.updateTeam(); // 更新战力

        // 级联动画渲染
        results.forEach((item, index) => {
            let card = document.createElement('div');
            card.className = `card-reveal rarity-${item.rarity}`;
            card.innerHTML = `
                <div class="cr-icon">${item.icon}</div>
                <div class="cr-name">${item.name}</div>
            `;
            grid.appendChild(card);
            
            // 延迟触发动画
            setTimeout(() => {
                card.classList.add('show');
                // 如果是SSR出金，稍微震动一下屏幕
                if(item.rarity === 'SSR') {
                    document.body.style.transform = 'translateY(5px)';
                    setTimeout(()=>document.body.style.transform = '', 50);
                }
            }, index * 100);
        });
    },

    closeResult() {
        document.getElementById('gacha-overlay').style.display = 'none';
    }
};

// ================= 4. 进化系统 (Evolution Engine) =================
const EvoSystem = {
    slots: [null, null],

    selectUnit(uid) {
        let unit = State.roster.find(u => u.uid === uid);
        if (!unit) return;

        // 如果已经在槽位里，点击则取消
        if (this.slots[0] === uid) { this.clearSlot(1); return; }
        if (this.slots[1] === uid) { this.clearSlot(2); return; }

        // 找空位放进去
        if (this.slots[0] === null) {
            this.slots[0] = uid;
        } else if (this.slots[1] === null) {
            this.slots[1] = uid;
        }

        this.renderSlots();
        UI.renderRoster(); // 刷新背包选中状态
    },

    clearSlot(idx) {
        this.slots[idx-1] = null;
        this.renderSlots();
        UI.renderRoster();
    },

    renderSlots() {
        let btn = document.getElementById('btn-fuse');
        let preview = document.getElementById('ui-fusion-preview');
        preview.innerText = '';
        btn.disabled = true;

        for (let i = 0; i < 2; i++) {
            let slotEl = document.getElementById(`slot-${i+1}`);
            let uid = this.slots[i];
            if (uid) {
                let unit = State.roster.find(u => u.uid === uid);
                let tData = getUnitData(unit.templateId);
                slotEl.innerHTML = tData.icon;
                slotEl.className = `slot filled rarity-${tData.rarity}`;
            } else {
                slotEl.innerHTML = '';
                slotEl.className = 'slot';
            }
        }

        // 判定是否可融合
        if (this.slots[0] && this.slots[1]) {
            let u1 = State.roster.find(u => u.uid === this.slots[0]);
            let u2 = State.roster.find(u => u.uid === this.slots[1]);
            
            // 判定1：同种同级融合升星
            if (u1.templateId === u2.templateId && u1.level === u2.level) {
                preview.innerText = `[预测结果] 等级提升：Lv.${u1.level} -> Lv.${u1.level + 1}`;
                preview.style.color = '#10b981';
                btn.disabled = false;
                return;
            }

            // 判定2：检查隐藏配方
            let combo1 = `${u1.templateId}+${u2.templateId}`;
            let combo2 = `${u2.templateId}+${u1.templateId}`;
            let recipe = DB.recipes[combo1] || DB.recipes[combo2];
            
            if (recipe) {
                preview.innerText = `[基因变异警报] 预测将产生神话生物：${recipe.name} ${recipe.icon}`;
                preview.style.color = 'var(--rarity-ur)';
                btn.disabled = false;
                return;
            }

            preview.innerText = "[排异反应] 基因链不兼容。";
            preview.style.color = '#ef4444';
        }
    },

    executeFusion() {
        let u1 = State.roster.find(u => u.uid === this.slots[0]);
        let u2 = State.roster.find(u => u.uid === this.slots[1]);
        
        // 判定结果
        let combo1 = `${u1.templateId}+${u2.templateId}`;
        let combo2 = `${u2.templateId}+${u1.templateId}`;
        let recipe = DB.recipes[combo1] || DB.recipes[combo2];

        // 删掉原来的两只 (从 roster 中移除)
        State.roster = State.roster.filter(u => u.uid !== u1.uid && u.uid !== u2.uid);

        if (recipe) {
            // 生成新物种
            State.roster.push({ uid: ++State.uidCounter, templateId: recipe.id, level: 1 });
            alert(`🎉 融合成功！你获得了变异神话生物：【${recipe.name}】！`);
        } else {
            // 升星
            State.roster.push({ uid: ++State.uidCounter, templateId: u1.templateId, level: u1.level + 1 });
            alert(`✨ 进化成功！当前等级：Lv.${u1.level + 1}`);
        }

        // 重置
        this.slots = [null, null];
        this.renderSlots();
        UI.renderRoster();
        CombatSystem.updateTeam();
    }
};

// ================= 5. 战斗与挂机系统 (Idle Combat System) =================
const CombatSystem = {
    totalPower: 0,
    bps: 0, // Biomass per second
    
    // 只取战力最高的前 5 只上阵
    updateTeam() {
        let teamInfo = State.roster.map(u => {
            let tData = getUnitData(u.templateId);
            let rConf = DB.rarityConfigs[tData.rarity];
            // 公式：基础值 * (1.5 ^ (等级-1))
            let power = Math.floor(rConf.powerBase * Math.pow(1.5, u.level - 1));
            let produce = rConf.produceBase * u.level;
            return { ...u, ...tData, power, produce };
        });

        // 排序并取前5
        teamInfo.sort((a, b) => b.power - a.power);
        let top5 = teamInfo.slice(0, 5);

        this.totalPower = 0;
        this.bps = 0;
        
        const teamBox = document.getElementById('team-player');
        teamBox.innerHTML = '';

        top5.forEach(u => {
            this.totalPower += u.power;
            this.bps += u.produce;
            teamBox.innerHTML += `
                <div class="unit-thumb rarity-${u.rarity}" style="width:45px; font-size:1.2rem;">
                    ${u.icon} <span class="unit-lvl">Lv.${u.level}</span>
                </div>
            `;
        });

        document.getElementById('ui-power').innerText = this.totalPower;
        document.getElementById('ui-bps').innerText = `+${this.bps}/s`;
    },

    // 核心主循环
    loop() {
        if (this.bps > 0) {
            State.biomass += this.bps;
            UI.updateHeader();
            
            // 制造视觉打击特效
            if (Math.random() < 0.3) this.spawnDamageText();
        }
        requestAnimationFrame(() => this.loop()); // 60fps 循环
    },

    spawnDamageText() {
        let arena = document.querySelector('.arena');
        let text = document.createElement('div');
        text.className = 'dmg-text';
        text.innerText = `-${Math.floor(this.totalPower * (0.8 + Math.random()*0.4))}`;
        
        // 随机在右侧区域生成
        text.style.left = `${50 + Math.random() * 40}%`;
        text.style.top = `${20 + Math.random() * 60}%`;
        
        arena.appendChild(text);
        setTimeout(() => text.remove(), 800);
    }
};

// ================= 6. UI 渲染与路由 (View Management) =================
const UI = {
    init() {
        this.updateHeader();
        this.renderRoster();
        document.getElementById('ui-pity').innerText = 50 - State.pityCount;
        CombatSystem.updateTeam();
        
        // 预设几个假敌人
        document.getElementById('team-enemy').innerHTML = `
            <div class="unit-thumb rarity-N" style="width:45px; font-size:1.2rem; filter:grayscale(1);">👾</div>
            <div class="unit-thumb rarity-N" style="width:45px; font-size:1.2rem; filter:grayscale(1);">👽</div>
            <div class="unit-thumb rarity-R" style="width:45px; font-size:1.2rem; filter:grayscale(1);">🦠</div>
        `;
        
        // 启动挂机循环
        let lastTime = Date.now();
        setInterval(() => {
            let now = Date.now();
            let dt = (now - lastTime) / 1000;
            lastTime = now;
            if(CombatSystem.bps > 0) {
                State.biomass += CombatSystem.bps * dt;
                this.updateHeader();
            }
        }, 1000); // 资源每秒结算1次
        
        CombatSystem.loop(); // 动画特效跑 requestAnimationFrame
    },

    switchTab(tabId, navEl) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(`view-${tabId}`).classList.add('active');
        navEl.classList.add('active');
        
        if (tabId === 'lab') this.renderRoster(); // 切换到实验室时刷新背包
    },

    updateHeader() {
        document.getElementById('ui-biomass').innerText = Math.floor(State.biomass);
    },

    renderRoster() {
        let container = document.getElementById('ui-roster');
        container.innerHTML = '';
        document.getElementById('ui-roster-count').innerText = State.roster.length;

        // 按稀有度和等级排序
        let sorted = [...State.roster].sort((a,b) => {
            let ra = DB.rarityConfigs[getUnitData(a.templateId).rarity].powerBase;
            let rb = DB.rarityConfigs[getUnitData(b.templateId).rarity].powerBase;
            if(rb !== ra) return rb - ra;
            return b.level - a.level;
        });

        sorted.forEach(u => {
            let tData = getUnitData(u.templateId);
            let isSelected = (EvoSystem.slots[0] === u.uid || EvoSystem.slots[1] === u.uid);
            let classStr = `unit-thumb rarity-${tData.rarity} ${isSelected ? 'selected' : ''}`;
            
            container.innerHTML += `
                <div class="${classStr}" onclick="EvoSystem.selectUnit(${u.uid})">
                    ${tData.icon}
                    <span class="unit-lvl">Lv.${u.level}</span>
                </div>
            `;
        });
    }
};

// 启动引擎
window.onload = () => { UI.init(); };

</script>
