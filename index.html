<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文明余烬 (Embers of Civilization)</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --panel-bg: #1a1a1e;
            --text-main: #d1d1d6;
            --text-muted: #6e6e76;
            --accent: #d4af37;
            --danger: #ff4c4c;
            --border: #2a2a35;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        #game-container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h2, h3 { color: var(--accent); margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 5px; font-size: 1.1em;}
        
        .hidden { display: none !important; }
        
        /* 资源列表 */
        .resource-row { display: flex; justify-content: space-between; margin: 8px 0; }
        .res-name { font-weight: bold; }
        .res-rate { font-size: 0.8em; color: var(--text-muted); }
        .res-danger { color: var(--danger); }

        /* 按钮样式 */
        button {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
        }
        button:hover:not(:disabled) { background: #25252b; border-color: var(--accent); }
        button:disabled { color: var(--text-muted); cursor: not-allowed; opacity: 0.5; }
        button .cost { font-size: 0.8em; color: var(--text-muted); float: right; }

        /* 职业分配 */
        .job-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 5px; background: #222; border-radius: 4px;}
        .job-controls button { width: 30px; margin: 0 2px; text-align: center; padding: 4px; }

        /* 日志 */
        #log-container { height: 400px; overflow-y: auto; font-family: monospace; font-size: 0.9em; display: flex; flex-direction: column-reverse;}
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #333; padding-bottom: 5px;}
        .log-time { color: var(--text-muted); margin-right: 10px; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="panel" id="resources-panel">
        <h2>物资储备</h2>
        <div class="resource-row">
            <span class="res-name">木材</span>
            <span><span id="res-wood">0</span> <span id="rate-wood" class="res-rate">(+0/s)</span></span>
        </div>
        <div class="resource-row hidden" id="row-food">
            <span class="res-name">食物</span>
            <span><span id="res-food">0</span> <span id="rate-food" class="res-rate">(+0/s)</span></span>
        </div>
        
        <h3 class="hidden" id="title-pop" style="margin-top: 20px;">营地人口</h3>
        <div class="resource-row hidden" id="row-pop">
            <span class="res-name">空闲村民</span>
            <span><span id="pop-idle">0</span> / <span id="pop-max">0</span></span>
        </div>
        <div id="food-warning" class="res-danger hidden" style="font-size: 0.8em; margin-top: 5px;">警告：食物短缺！村民即将饿死！</div>
    </div>

    <div class="panel" id="main-panel">
        <h2>行动与建设</h2>
        
        <button id="btn-gather-wood" onclick="manualGatherWood()">
            徒手捡拾树枝 <span class="cost">+1 木材</span>
        </button>
        <button id="btn-gather-food" class="hidden" onclick="manualGatherFood()">
            采摘野果 <span class="cost">+1 食物</span>
        </button>

        <h3 style="margin-top: 20px;" class="hidden" id="title-build">基础设施</h3>
        
        <button id="btn-build-fire" class="hidden" onclick="buildCampfire()">
            升起篝火 <span class="cost" id="cost-fire">10 木材</span>
            <div style="font-size: 0.8em; color: var(--text-muted);">吸引流浪者，解锁食物与人口系统</div>
        </button>

        <button id="btn-build-hut" class="hidden" onclick="buildHut()">
            建造茅草屋 <span class="cost">木材: <span id="cost-hut">30</span></span>
            <div style="font-size: 0.8em; color: var(--text-muted);">提供居住空间 (人口上限 +2)</div>
        </button>
        
        <div id="job-panel" class="hidden" style="margin-top: 20px;">
            <h3>劳动力分配</h3>
            <div class="job-row">
                <span>伐木工 (产出木材)</span>
                <div class="job-controls">
                    <button onclick="assignJob('woodcutter', -1)">-</button>
                    <span id="job-woodcutter">0</span>
                    <button onclick="assignJob('woodcutter', 1)">+</button>
                </div>
            </div>
            <div class="job-row">
                <span>采集者 (产出食物)</span>
                <div class="job-controls">
                    <button onclick="assignJob('gatherer', -1)">-</button>
                    <span id="job-gatherer">0</span>
                    <button onclick="assignJob('gatherer', 1)">+</button>
                </div>
            </div>
        </div>
    </div>

    <div class="panel" id="log-panel">
        <h2>世界回响</h2>
        <div id="log-container"></div>
    </div>
</div>

<script>
    /* ================= 游戏核心数据状态 ================= */
    const state = {
        resources: {
            wood: 0,
            food: 0
        },
        population: {
            total: 0,
            idle: 0,
            max: 0
        },
        jobs: {
            woodcutter: 0,
            gatherer: 0
        },
        buildings: {
            campfire: 0,
            hut: 0
        },
        flags: {
            fireUnlocked: false,
            hutUnlocked: false
        },
        rates: {
            foodConsumptionPerPop: 0.5, // 每个村民每秒消耗食物
            woodPerCutter: 1,           // 每个伐木工每秒产木材
            foodPerGatherer: 1.2        // 每个采集者每秒产食物
        }
    };

    /* ================= 核心操作函数 ================= */
    function manualGatherWood() {
        state.resources.wood += 1;
        checkUnlocks();
        updateUI();
    }

    function manualGatherFood() {
        state.resources.food += 1;
        updateUI();
    }

    function buildCampfire() {
        if (state.resources.wood >= 10 && state.buildings.campfire === 0) {
            state.resources.wood -= 10;
            state.buildings.campfire = 1;
            state.population.max = 2; // 篝火提供初始2个人口容量
            state.population.total = 1; // 吸引第一个人
            state.population.idle = 1;
            logEvent("火光刺破了黑暗。一个流浪者被温暖吸引，加入了你的营地。你现在需要寻找食物来养活他们。");
            checkUnlocks();
            updateUI();
        }
    }

    // 指数级成本计算公式: 基础成本 * (1.15 ^ 建筑数量)
    function getHutCost() { return Math.floor(30 * Math.pow(1.15, state.buildings.hut)); }

    function buildHut() {
        const cost = getHutCost();
        if (state.resources.wood >= cost) {
            state.resources.wood -= cost;
            state.buildings.hut += 1;
            state.population.max += 2;
            logEvent(`一座新的茅草屋建成了。营地可以容纳更多人了 (当前上限: ${state.population.max})。`);
            updateUI();
        }
    }

    /* ================= 职业分配系统 ================= */
    function assignJob(jobType, amount) {
        if (amount > 0) {
            // 分配工作：必须有空闲人口
            if (state.population.idle >= amount) {
                state.population.idle -= amount;
                state.jobs[jobType] += amount;
            }
        } else {
            // 取消工作：该岗位必须有人
            if (state.jobs[jobType] >= Math.abs(amount)) {
                state.jobs[jobType] += amount; // amount是负数，所以是减少
                state.population.idle += Math.abs(amount);
            }
        }
        updateUI();
    }

    /* ================= 系统解锁机制 ================= */
    function checkUnlocks() {
        // 木材达到5，解锁篝火
        if (state.resources.wood >= 5 && !state.flags.fireUnlocked) {
            document.getElementById('title-build').classList.remove('hidden');
            document.getElementById('btn-build-fire').classList.remove('hidden');
            state.flags.fireUnlocked = true;
            logEvent("收集的木材足够生火了。你觉得在黑夜中需要一点光明。");
        }
        
        // 拥有篝火后，解锁食物面板、采集按钮和职业调度
        if (state.buildings.campfire > 0) {
            document.getElementById('btn-build-fire').classList.add('hidden'); // 篝火只能造一次
            document.getElementById('btn-gather-food').classList.remove('hidden');
            document.getElementById('row-food').classList.remove('hidden');
            document.getElementById('title-pop').classList.remove('hidden');
            document.getElementById('row-pop').classList.remove('hidden');
            document.getElementById('job-panel').classList.remove('hidden');
            
            // 木材达到20解锁茅草屋
            if (state.resources.wood >= 20 && !state.flags.hutUnlocked) {
                document.getElementById('btn-build-hut').classList.remove('hidden');
                state.flags.hutUnlocked = true;
            }
        }
    }

    /* ================= 主循环 (Tick) ================= */
    let lastTick = Date.now();
    let starvationTimer = 0;

    function gameLoop() {
        const now = Date.now();
        const dt = (now - lastTick) / 1000; // 时间差(秒)，防止浏览器休眠导致时间计算错误
        lastTick = now;

        if (state.buildings.campfire > 0) {
            // 1. 计算资源产出
            const woodGain = state.jobs.woodcutter * state.rates.woodPerCutter * dt;
            const foodGain = state.jobs.gatherer * state.rates.foodPerGatherer * dt;
            
            // 2. 计算食物消耗
            const foodLoss = state.population.total * state.rates.foodConsumptionPerPop * dt;
            
            // 3. 应用资源结算
            state.resources.wood += woodGain;
            state.resources.food += foodGain - foodLoss;

            // 4. 生存与惩罚机制 (饥荒)
            const warningEl = document.getElementById('food-warning');
            if (state.resources.food <= 0) {
                state.resources.food = 0;
                if (state.population.total > 0) {
                    warningEl.classList.remove('hidden');
                    starvationTimer += dt;
                    // 如果断粮超过 5 秒，饿死一个村民
                    if (starvationTimer >= 5) {
                        killVillager();
                        starvationTimer = 0;
                    }
                }
            } else {
                warningEl.classList.add('hidden');
                starvationTimer = 0;
            }

            // 5. 人口自然增长
            if (state.resources.food > 10 && state.population.total < state.population.max) {
                // 简单的概率触发：每秒有 2% 概率吸引新村民
                if (Math.random() < 0.02 * dt) {
                    state.population.total += 1;
                    state.population.idle += 1;
                    logEvent("充足的食物和安全的营地吸引了一名新的流浪者。");
                }
            }
        }

        updateUI();
        requestAnimationFrame(gameLoop); // 使用 requestAnimationFrame 保证动画帧率同步
    }

    function killVillager() {
        if (state.population.total <= 0) return;
        state.population.total -= 1;
        // 优先扣除空闲人口，若无则随机扣除工作人口
        if (state.population.idle > 0) {
            state.population.idle -= 1;
        } else if (state.jobs.gatherer > 0) {
            state.jobs.gatherer -= 1;
        } else if (state.jobs.woodcutter > 0) {
            state.jobs.woodcutter -= 1;
        }
        logEvent("<span class='res-danger'>可怕的饥荒！一名村民饿死了...</span>");
    }

    /* ================= UI 渲染与日志系统 ================= */
    function updateUI() {
        // 更新资源文本 (向下取整显示)
        document.getElementById('res-wood').textContent = Math.floor(state.resources.wood);
        document.getElementById('res-food').textContent = Math.floor(state.resources.food);
        
        // 更新速率显示
        const netFoodRate = (state.jobs.gatherer * state.rates.foodPerGatherer) - (state.population.total * state.rates.foodConsumptionPerPop);
        document.getElementById('rate-wood').textContent = `(+${(state.jobs.woodcutter * state.rates.woodPerCutter).toFixed(1)}/s)`;
        
        const foodRateEl = document.getElementById('rate-food');
        foodRateEl.textContent = `(${netFoodRate >= 0 ? '+' : ''}${netFoodRate.toFixed(1)}/s)`;
        foodRateEl.className = netFoodRate < 0 ? 'res-danger' : 'res-rate'; // 负增长标红

        // 更新人口和职业
        document.getElementById('pop-idle').textContent = state.population.idle;
        document.getElementById('pop-max').textContent = state.population.max;
        document.getElementById('job-woodcutter').textContent = state.jobs.woodcutter;
        document.getElementById('job-gatherer').textContent = state.jobs.gatherer;

        // 更新按钮可用性与动态成本
        document.getElementById('btn-build-fire').disabled = state.resources.wood < 10;
        
        const currentHutCost = getHutCost();
        document.getElementById('cost-hut').textContent = currentHutCost;
        document.getElementById('btn-build-hut').disabled = state.resources.wood < currentHutCost;
    }

    function logEvent(msg) {
        const container = document.getElementById('log-container');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        
        entry.innerHTML = `<span class="log-time">[${timeStr}]</span> ${msg}`;
        container.prepend(entry); // 新日志加在最上面
    }

    // 启动游戏
    logEvent("你独自在荒野中醒来。寒冷刺骨，你需要马上收集一些柴火。");
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
