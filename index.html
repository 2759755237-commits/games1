<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>咸鱼阴阳师 - Idle Onmyoji</title>
    <style>
        /* =========================================================
           [视觉层] 咸鱼阴阳师 样式系统 (CSS)
           和风暗黑主题 + 现代挂机游戏布局
           ========================================================= */
        :root {
            /* 主题配色 */
            --bg-main: #141118;      /* 深紫黑背景 */
            --bg-panel: #221d2b;     /* 面板背景 */
            --border-color: #3d324c; /* 边框紫 */
            --text-main: #e2d8ee;    /* 文本主色 */
            --text-muted: #8b7d9b;   /* 文本暗色 */
            
            /* 资源配色 */
            --color-coin: #facc15;   /* 金币黄 */
            --color-jade: #f43f5e;   /* 勾玉红 */
            
            /* 稀有度配色 */
            --r-n: #94a3b8;          /* N 灰 */
            --r-r: #60a5fa;          /* R 蓝 */
            --r-sr: #c084fc;         /* SR 紫 */
            --r-ssr: #fbbf24;        /* SSR 金 */
            
            --nav-height: 60px;
            --header-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 移动端竖屏模拟容器 */
        #app-container {
            width: 100%;
            max-width: 480px; /* 在电脑上显示为手机比例 */
            height: 100%;
            background-color: var(--bg-main);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* --- 顶部资源栏 --- */
        #header {
            height: var(--header-height);
            background: linear-gradient(180deg, #1f182b 0%, var(--bg-main) 100%);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 10;
        }
        .stage-info { font-weight: 900; font-size: 1.2rem; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .stage-info span { color: var(--color-jade); }
        .res-box { display: flex; gap: 10px; }
        .res-item { background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 5px; font-weight: bold; font-family: monospace; font-size: 1.1rem; }
        .icon-coin { color: var(--color-coin); text-shadow: 0 0 5px var(--color-coin); }
        .icon-jade { color: var(--color-jade); text-shadow: 0 0 5px var(--color-jade); }

        /* --- 核心内容区 (Tabs) --- */
        #main-content {
            flex: 1;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 20px;
        }
        .view-tab {
            position: absolute;
            top: 0; left: 0; width: 100%; min-height: 100%;
            padding: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            display: flex;
            flex-direction: column;
        }
        .view-tab.active { opacity: 1; pointer-events: auto; position: relative; }

        /* --- 战斗界面 (Combat) --- */
        .battle-arena { flex: 1; background: url('data:image/svg+xml;utf8,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1" fill="%233d324c"/></svg>'); border-radius: 12px; border: 1px solid var(--border-color); position: relative; margin-bottom: 15px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-shadow: inset 0 0 40px rgba(0,0,0,0.8); }
        
        .enemy-zone { align-self: flex-end; width: 120px; height: 120px; position: relative; display: flex; justify-content: center; align-items: center; font-size: 5rem; text-shadow: 0 10px 20px #000; transition: 0.1s; }
        .boss-hp-container { position: absolute; top: -15px; width: 150px; background: #000; border: 2px solid #222; border-radius: 10px; height: 14px; overflow: hidden; }
        .boss-hp-bar { height: 100%; background: linear-gradient(90deg, #ef4444, #b91c1c); width: 100%; transition: width 0.1s linear; }
        .boss-hp-text { position: absolute; width: 100%; text-align: center; color: white; font-size: 10px; font-weight: bold; line-height: 10px; top: 0; text-shadow: 1px 1px 0 #000; }
        
        .shikigami-zone { display: flex; flex-wrap: wrap; gap: 10px; width: 60%; align-content: flex-end; }
        .s-slot { width: 50px; height: 50px; border-radius: 8px; font-size: 1.8rem; display: flex; justify-content: center; align-items: center; border: 2px solid var(--border-color); background: rgba(0,0,0,0.6); position: relative; }
        
        .dps-panel { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 15px; border-radius: 10px; text-align: center; font-size: 1.1rem; font-weight: bold; color: var(--text-main); }
        .dps-panel span { color: var(--color-jade); font-size: 1.3rem; }

        /* --- 式神养成界面 (Roster) --- */
        .roster-grid { display: flex; flex-direction: column; gap: 10px; }
        .shikigami-card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 15px; }
        .s-avatar { width: 60px; height: 60px; font-size: 2.2rem; display: flex; justify-content: center; align-items: center; border-radius: 8px; border: 2px solid; background: #000; position: relative; }
        .s-info { flex: 1; }
        .s-name { font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .s-stats { font-size: 0.85rem; color: var(--text-muted); }
        .s-stats span { color: var(--color-jade); font-weight: bold; }
        .btn-upgrade { background: var(--border-color); color: #fff; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.1s; }
        .btn-upgrade:active { transform: scale(0.95); }
        .btn-upgrade:disabled { opacity: 0.4; }

        /* --- 召唤界面 (Gacha) --- */
        .gacha-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
        .summon-banner { font-size: 6rem; text-shadow: 0 0 30px var(--color-jade); animation: float 2s infinite ease-in-out; }
        .gacha-btns { display: flex; flex-direction: column; gap: 15px; width: 100%; padding: 0 20px; }
        .btn-summon { width: 100%; background: linear-gradient(90deg, #b91c1c, #991b1b); border: 2px solid var(--color-jade); color: #fff; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; box-shadow: 0 5px 15px rgba(244, 63, 94, 0.3); }
        .btn-summon:active { transform: translateY(2px); box-shadow: none; }
        .btn-summon span { font-size: 0.8rem; font-weight: normal; color: #fca5a5; }

        /* 抽卡结果弹窗 */
        #gacha-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .gacha-result-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 20px; }
        .gacha-card { width: 80px; height: 110px; background: #111; border: 2px solid; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .gacha-card-icon { font-size: 2.5rem; }
        .gacha-card-name { font-size: 0.75rem; font-weight: bold; margin-top: 5px; background: rgba(0,0,0,0.6); padding: 2px; border-radius: 3px; }
        .gacha-card-new { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; font-size: 0.6rem; font-weight: bold; padding: 2px 5px; border-radius: 10px; animation: blink 1s infinite; }

        /* --- 底部导航栏 --- */
        #bottom-nav {
            height: var(--nav-height);
            background: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            display: flex;
            z-index: 10;
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-muted); cursor: pointer; transition: 0.2s; font-size: 0.85rem; font-weight: bold; gap: 4px; }
        .nav-item.active { color: var(--text-main); background: rgba(255,255,255,0.05); }
        .nav-item.active .nav-icon { color: var(--color-jade); transform: translateY(-2px); }
        .nav-icon { font-size: 1.3rem; transition: 0.2s; }

        /* --- 全局动态特效与类 --- */
        /* 稀有度边框与颜色 */
        .r-N { border-color: var(--r-n); color: var(--r-n); }
        .r-R { border-color: var(--r-r); color: var(--r-r); text-shadow: 0 0 5px var(--r-r); }
        .r-SR { border-color: var(--r-sr); color: var(--r-sr); box-shadow: 0 0 10px rgba(192,132,252,0.3); }
        .r-SSR { border-color: var(--r-ssr); color: var(--r-ssr); box-shadow: 0 0 20px rgba(251,191,36,0.6); }
        
        /* 战斗飘字 */
        .dmg-text { position: absolute; color: white; font-weight: 900; font-size: 1.5rem; text-shadow: 0 2px 4px #000, 0 0 10px #ef4444; animation: floatUp 0.6s forwards; pointer-events: none; z-index: 50; }
        
        /* 攻击动作 */
        .anim-attack { animation: atkDash 0.2s; }
        .anim-hit { animation: shake 0.2s; filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }
        @keyframes atkDash { 0% { transform: translate(0, 0); } 50% { transform: translate(15px, -15px); } 100% { transform: translate(0, 0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div id="app-container">
    
    <header id="header">
        <div class="stage-info">第 <span><span id="ui-stage">1</span></span> 探索卷</div>
        <div class="res-box">
            <div class="res-item"><span class="icon-coin">🪙</span> <span id="ui-coins">0</span></div>
            <div class="res-item"><span class="icon-jade">☯️</span> <span id="ui-jade">0</span></div>
        </div>
    </header>

    <main id="main-content">
        
        <div id="view-combat" class="view-tab active">
            <div class="battle-arena" id="arena">
                <div class="enemy-zone" id="boss-entity">
                    👹
                    <div class="boss-hp-container">
                        <div class="boss-hp-bar" id="ui-boss-hp-bar"></div>
                        <div class="boss-hp-text"><span id="ui-boss-hp-curr">500</span> / <span id="ui-boss-hp-max">500</span></div>
                    </div>
                </div>
                <div class="shikigami-zone" id="ui-combat-team">
                    </div>
            </div>
            <div class="dps-panel">
                全阵眼总灵力 (秒伤): <br>
                <span id="ui-total-dps">0</span>
            </div>
        </div>

        <div id="view-roster" class="view-tab">
            <h2 style="margin-bottom: 15px; color: var(--text-main); font-size: 1.2rem;">百鬼夜行图鉴</h2>
            <div class="roster-grid" id="ui-roster-list">
                </div>
        </div>

        <div id="view-summon" class="view-tab">
            <div class="gacha-container">
                <div class="summon-banner">⛩️</div>
                <div style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">画符念咒，召唤强大式神<br>SSR概率: 5% | SR概率: 20%</div>
                <div class="gacha-btns">
                    <button class="btn-summon" onclick="GameApp.Gacha.summon(1)">
                        单次召唤
                        <span>消耗 100 ☯️ 勾玉</span>
                    </button>
                    <button class="btn-summon" onclick="GameApp.Gacha.summon(10)" style="background: linear-gradient(90deg, #fbbf24, #d97706); border-color: #fff; box-shadow: 0 5px 20px rgba(251, 191, 36, 0.4);">
                        十连召唤
                        <span style="color: #fef3c7;">消耗 1000 ☯️ 勾玉</span>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <nav id="bottom-nav">
        <div class="nav-item active" data-target="combat">
            <div class="nav-icon">⚔️</div>
            <div>讨伐</div>
        </div>
        <div class="nav-item" data-target="roster">
            <div class="nav-icon">📜</div>
            <div>式神录</div>
        </div>
        <div class="nav-item" data-target="summon">
            <div class="nav-icon">🔮</div>
            <div>召唤</div>
        </div>
    </nav>

    <div id="gacha-overlay" onclick="this.style.display='none'">
        <h2 style="color:white; margin-top: 40px; text-shadow: 0 0 10px #fff; letter-spacing: 2px;">急急如律令！</h2>
        <div class="gacha-result-grid" id="ui-gacha-results"></div>
        <div style="color: #888; font-size: 0.9rem; margin-top: 30px; animation: blink 1.5s infinite;">点击任意处关闭</div>
    </div>

</div>

<script>
    // 建立全局大箱子
    const GameApp = {};

    // ---------------------------------------------------------

    // ========================================================================

    // 设计理念：所有动态数据集中管理，严禁外部直接修改，必须通过专属接口调用。

    /**
     * 玩家核心状态容器
     */
    GameApp.State = {
        // --- 1. 核心可持久化数据 (会被保存到 LocalStorage 的数据) ---
        Data: {
            version: "1.0.0",               // 存档版本，用于未来的数据结构升级
            lastSaveTime: Date.now(),       // 上次保存的时间戳，用于计算离线收益
            
            // 资源账户
            Resources: {
                coins: 500,                 // 初始赠送 500 金币
                jade: 1500,                 // 初始赠送 1500 勾玉 (可以先抽几次爽一下)
                shikigamiExp: 0             // 备用：高级培养材料
            },
            
            // 推图进度
            Progression: {
                currentStage: 1,            // 当前正在攻打的关卡
                highestStage: 1,            // 历史最高关卡
                totalKills: 0               // 累计击杀怪物总数
            },
            
            // 抽卡数据中心 (Gacha Hub)
            Gacha: {
                totalPulls: 0,              // 历史总抽卡数
                pityCounterSSR: 0,          // SSR 保底计数器 (抽出SSR则清零)
                pityCounterSP: 0            // SP 隐藏保底计数器
            },
            
            // 式神录 (Roster) 
            // 格式: { 's_id': { level: 1, shards: 0, star: 1 } }
            Shikigami: {},
            
            // 当前上阵的队伍编队 (最多5人)
            Team: [] 
        },

        // --- 2. 状态操作接口 (Mutators / Actions) ---

        /**
         * 安全修改资源 (支持正负值)
         * @param {string} type - 'coins' 或 'jade'
         * @param {number} amount - 变动数量
         * @returns {boolean} - 是否扣除/增加成功
         */
        modifyResource: function(type, amount) {
            if (this.Data.Resources[type] === undefined) return false;
            let current = this.Data.Resources[type];
            if (current + amount < 0) return false; // 余额不足
            
            this.Data.Resources[type] += amount;
            
            // 触发 UI 刷新 (该方法将在第五部分 UI层 定义)
            if (typeof GameApp.UI !== 'undefined') {
                GameApp.UI.updateResources();
            }
            return true;
        },

        /**
         * 检查是否拥有足够的资源
         */
        hasResource: function(type, amount) {
            return (this.Data.Resources[type] || 0) >= amount;
        },

        /**
         * 获得一个新式神或其碎片
         * @param {string} shikigamiId - 式神ID
         * @param {number} isNew - 是否为首次获得
         */
        addShikigami: function(shikigamiId) {
            let sData = this.Data.Shikigami[shikigamiId];
            if (sData) {
                // 已拥有，转化为碎片 (觉醒/升星系统备用)
                sData.shards += 10; 
                return false; // 返回 false 表示是重复的
            } else {
                // 首次获得
                this.Data.Shikigami[shikigamiId] = {
                    level: 1,
                    shards: 0,
                    star: 1
                };
                this.autoFormTeam(); // 获得新式神后，重新计算最强阵容
                return true; // 返回 true 表示是全新的
            }
        },

        /**
         * 获取某个式神当前的真实面板属性 (计算了等级、稀有度成长)
         * @param {string} shikigamiId 
         */
        getShikigamiStats: function(shikigamiId) {
            let myData = this.Data.Shikigami[shikigamiId];
            if (!myData) return null;

            let baseData = GameApp.Data.Shikigami[shikigamiId];
            let rarityData = GameApp.Data.Rarity[baseData.rarity];
            
            // 核心成长公式：基础属性 * (成长指数 ^ (等级 - 1))
            let levelMult = Math.pow(rarityData.growthExp, myData.level - 1);
            
            // 计算升级所需金币：基础费用 * (消费指数 ^ (等级 - 1))
            let upgradeCost = Math.floor(rarityData.upgradeCostBase * Math.pow(rarityData.upgradeCostExp, myData.level - 1));

            return {
                id: shikigamiId,
                name: baseData.name,
                rarity: baseData.rarity,
                icon: baseData.icon,
                level: myData.level,
                shards: myData.shards,
                // 计算最终战斗属性
                atk: Math.floor(rarityData.baseAtk * levelMult),
                hp: Math.floor(rarityData.baseHp * levelMult),
                speed: baseData.atkSpeed,
                upgradeCost: upgradeCost,
                isMaxLevel: myData.level >= rarityData.maxLevel
            };
        },

        /**
         * 【核心算法】自动排兵布阵 (Auto-Formation)
         * 遍历玩家拥有的所有式神，计算他们的最终攻击力，挑选最强的 5 个上阵
         */
        autoFormTeam: function() {
            let allOwned = [];
            for (let id in this.Data.Shikigami) {
                allOwned.push(this.getShikigamiStats(id));
            }
            
            // 按攻击力从高到低排序
            allOwned.sort((a, b) => b.atk - a.atk);
            
            // 截取前 5 名
            let top5 = allOwned.slice(0, GameApp.Data.System.COMBAT_MAX_ROSTER);
            
            this.Data.Team = top5.map(s => s.id);
            
            // 刷新队伍 UI
            if (typeof GameApp.UI !== 'undefined') {
                GameApp.UI.renderCombatTeam();
                GameApp.UI.updateDPS();
            }
        },

        /**
         * 获取当前小队每秒总伤害 (DPS)
         */
        getTeamTotalDPS: function() {
            let totalAtk = 0;
            for (let i = 0; i < this.Data.Team.length; i++) {
                let stats = this.getShikigamiStats(this.Data.Team[i]);
                if (stats) {
                    // DPS = 攻击力 * 攻击频率
                    totalAtk += (stats.atk * stats.speed);
                }
            }
            return Math.floor(totalAtk);
        }
    };


    /**
     * 本地存储与离线系统引擎 (Persistance & Offline Engine)
     */
    GameApp.Storage = {
        saveKey: 'idle_onmyoji_save_v1',

        // 保存游戏
        save: function() {
            GameApp.State.Data.lastSaveTime = Date.now();
            let saveData = JSON.stringify(GameApp.State.Data);
            localStorage.setItem(this.saveKey, saveData);
            console.log("[System] Game Saved.");
        },

        // 读取游戏
        load: function() {
            let saved = localStorage.getItem(this.saveKey);
            if (saved) {
                try {
                    let parsedData = JSON.parse(saved);
                    // 简单的版本兼容：合并对象
                    Object.assign(GameApp.State.Data, parsedData);
                    console.log("[System] Save Loaded Successfully.");
                    
                    // 读取成功后，计算离线收益
                    this.calculateOfflineProgress();
                } catch (e) {
                    console.error("[System] Save Corrupted. Using default state.", e);
                    this.initDefault();
                }
            } else {
                // 纯新号，初始化默认状态
                this.initDefault();
            }
            
            // 加载完成后，强制重新计算最强阵容
            GameApp.State.autoFormTeam();
        },

        // 初始化新号赠送 (例如：开局送一只雪女)
        initDefault: function() {
            console.log("[System] New Account Initialized.");
            GameApp.State.addShikigami('sr_yukionna');
            // 初始化立即保存一次
            this.save();
        },

        /**
         * 【硬核逻辑】离线收益演算 (Offline Calculation)
         * 根据玩家离开的时间，模拟挂机推图的收益。
         */
        calculateOfflineProgress: function() {
            let now = Date.now();
            let lastTime = GameApp.State.Data.lastSaveTime;
            
            // 计算离开的秒数
            let diffSeconds = Math.floor((now - lastTime) / 1000);
            
            // 如果离开不到 60 秒，不计算离线收益
            if (diffSeconds < 60) return;

            // 限制最大离线时间 (防止改系统时间作弊，最高 24 小时)
            let maxSeconds = GameApp.Data.System.MAX_OFFLINE_HOURS * 3600;
            if (diffSeconds > maxSeconds) diffSeconds = maxSeconds;

            // 获取当前队伍秒伤
            let teamDPS = GameApp.State.getTeamTotalDPS();
            if (teamDPS <= 0) return; // 没伤害打不动怪

            // 粗略模拟算法：
            // 假设当前关卡怪物血量为 BossHP
            let currentStage = GameApp.State.Data.Progression.currentStage;
            let bossHp = GameApp.Data.Stage.baseHp * Math.pow(GameApp.Data.Stage.hpScale, currentStage - 1);
            
            // 打死一只怪需要多少秒
            let timePerKill = Math.ceil(bossHp / teamDPS);
            if (timePerKill < 1) timePerKill = 1;

            // 离线期间击杀了多少只怪
            let kills = Math.floor(diffSeconds / timePerKill);
            
            if (kills > 0) {
                // 计算掉落
                let stageBaseCoin = GameApp.Data.Stage.baseCoin * Math.pow(GameApp.Data.Stage.coinScale, currentStage - 1);
                let earnedCoins = Math.floor(kills * stageBaseCoin);
                
                // 增加资源
                GameApp.State.modifyResource('coins', earnedCoins);
                GameApp.State.Data.Progression.totalKills += kills;

                // 弹出炫酷的离线收益提示框 (将在 UI 层实现，这里先 console.log)
                let hours = (diffSeconds / 3600).toFixed(1);
                console.log(`[Offline Report] You were gone for ${hours} hours.`);
                console.log(`[Offline Report] Your Shikigami defeated ${kills} enemies!`);
                console.log(`[Offline Report] Loot: +${earnedCoins} Coins`);
                
                // 延迟调用 UI 弹窗提示 (如果 UI 已加载)
                setTimeout(() => {
                    if (typeof GameApp.UI !== 'undefined' && GameApp.UI.showOfflineReport) {
                        GameApp.UI.showOfflineReport(hours, kills, earnedCoins);
                    }
                }, 1000);
            }
        },

        // 硬重置 (删号重练)
        hardReset: function() {
            if (confirm("警告：此操作将永久删除您的所有数据（包括已抽到的SSR）。确定继续吗？")) {
                localStorage.removeItem(this.saveKey);
                location.reload(); // 刷新页面重新开始
            }
        }
    };

    // 设计理念：纯逻辑层 (Logic Layer)。这里不碰任何 DOM 和 UI，只处理数据。
    // 所有方法执行完毕后，通过回调或标记通知 UI 层刷新。这种高度解耦的架构

    /**
     * 游戏通用数学与工具箱 (Utility & Math Library)
     */
    GameApp.Utils = {
        // 生成指定范围内的随机整数 [min, max]
        randomInt: function(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        },
        
        // 浮点数随机
        randomFloat: function(min, max) {
            return Math.random() * (max - min) + min;
        },

        // 大数字格式化 (咸鱼类游戏必备：1.2K, 3.5M, 1.4B, 2.5T...)
        formatNumber: function(num) {
            if (num < 1000) return Math.floor(num).toString();
            const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
            const suffixNum = Math.floor(("" + Math.floor(num)).length / 3);
            let shortValue = parseFloat((suffixNum !== 0 ? (num / Math.pow(1000, suffixNum)) : num).toPrecision(3));
            if (shortValue % 1 !== 0) shortValue = shortValue.toFixed(1);
            return shortValue + suffixes[suffixNum];
        },

        // 根据权重在数组中随机抽取元素 (常用于抽卡/掉落)
        weightedRandom: function(pool, weightKey) {
            let totalWeight = pool.reduce((sum, item) => sum + item[weightKey], 0);
            let randomNum = Math.random() * totalWeight;
            let weightSum = 0;
            for (let i = 0; i < pool.length; i++) {
                weightSum += pool[i][weightKey];
                if (randomNum <= weightSum) return pool[i];
            }
            return pool[pool.length - 1]; // Fallback
        }
    };

    GameApp.Systems = {

        // =========================================================
        // 4.1 抽卡与召唤引擎 (Gacha Engine)
        // 包含硬保底、伪随机纠正、碎片转化机制
        // =========================================================
        Gacha: {
            /**
             * 执行召唤请求
             * @param {number} times - 召唤次数 (1 或 10)
             * @returns {Array} - 抽取的式神结果对象数组
             */
            summon: function(times) {
                let costConfig = GameApp.Data.Gacha.StandardBanner;
                let totalCost = times === 10 ? costConfig.tenPullDiscount : costConfig.costPerPull;
                
                // 1. 资源校验
                if (!GameApp.State.hasResource(costConfig.costType, totalCost)) {
                    console.warn("[Gacha] 资源不足，召唤失败。");
                    return null; // 通知 UI 资源不足
                }

                // 2. 扣除资源
                GameApp.State.modifyResource(costConfig.costType, -totalCost);
                GameApp.State.Data.Gacha.totalPulls += times;

                // 3. 执行抽取逻辑
                let results = [];
                for (let i = 0; i < times; i++) {
                    results.push(this._rollSingle());
                }

                // 4. 保存游戏并刷新 UI
                GameApp.Storage.save();
                if (typeof GameApp.UI !== 'undefined') {
                    GameApp.UI.showGachaResults(results);
                }
                
                return results;
            },

            /**
             * 内部私有方法：单次抽取底层逻辑
             */
            _rollSingle: function() {
                GameApp.State.Data.Gacha.pityCounterSSR++;
                let gachaData = GameApp.State.Data.Gacha;
                let targetRarity = 'N';

                // --- 阶段 A：保底机制判定 ---
                // 硬保底：达到 100 抽必定 SSR
                if (gachaData.pityCounterSSR >= GameApp.Data.Gacha.StandardBanner.pityLimit) {
                    targetRarity = 'SSR';
                    gachaData.pityCounterSSR = 0; // 重置保底
                    console.log("[Gacha] 触发 SSR 极限保底！");
                } else {
                    // --- 阶段 B：常规权重随机 ---
                    let rarityPool = [];
                    for (let key in GameApp.Data.Rarity) {
                        rarityPool.push(GameApp.Data.Rarity[key]);
                    }
                    let pulledRarityObj = GameApp.Utils.weightedRandom(rarityPool, 'summonWeight');
                    targetRarity = pulledRarityObj.id;

                    // 脸白抽到 SSR，提前重置保底
                    if (targetRarity === 'SSR' || targetRarity === 'SP') {
                        gachaData.pityCounterSSR = 0;
                    }
                }

                // --- 阶段 C：在特定稀有度池中等概率捞取具体式神 ---
                let availableShikigami = [];
                for (let sId in GameApp.Data.Shikigami) {
                    if (GameApp.Data.Shikigami[sId].rarity === targetRarity) {
                        availableShikigami.push(GameApp.Data.Shikigami[sId]);
                    }
                }
                
                // 防止配置表为空的防崩处理
                if (availableShikigami.length === 0) return null; 
                
                let pulledShikigami = availableShikigami[GameApp.Utils.randomInt(0, availableShikigami.length - 1)];

                // --- 阶段 D：写入玩家库存并处理碎片转化 ---
                let isNew = GameApp.State.addShikigami(pulledShikigami.id);

                return {
                    shikigamiId: pulledShikigami.id,
                    data: pulledShikigami,
                    isNew: isNew
                };
            }
        },

        // =========================================================
        // 4.2 养成与强化引擎 (Upgrade Engine)
        // 包含等级提升、金币消耗计算、防作弊校验
        // =========================================================
        Upgrade: {
            /**
             * 升级指定的式神
             * @param {string} shikigamiId 
             */
            levelUp: function(shikigamiId) {
                let stats = GameApp.State.getShikigamiStats(shikigamiId);
                if (!stats) return false;

                // 满级拦截
                if (stats.isMaxLevel) {
                    console.warn("[Upgrade] 式神已达当前星级满级。");
                    return false;
                }

                // 资源拦截
                let cost = stats.upgradeCost;
                if (!GameApp.State.hasResource('coins', cost)) {
                    console.warn("[Upgrade] 金币不足。");
                    return false;
                }

                // 执行升级
                GameApp.State.modifyResource('coins', -cost);
                GameApp.State.Data.Shikigami[shikigamiId].level++;

                // 升级后可能成为最强，重新洗牌出战阵容
                GameApp.State.autoFormTeam();
                
                // 更新 UI
                if (typeof GameApp.UI !== 'undefined') {
                    GameApp.UI.renderRoster();
                    GameApp.UI.updateDPS();
                }

                return true;
            }
        },

        // =========================================================
        // 4.3 战斗与推图状态机 (Combat & Progression Engine)
        // 咸鱼模式的核心驱动力，每秒造成伤害并推进关卡
        // =========================================================
        Combat: {
            currentEnemyHp: 0,
            currentEnemyMaxHp: 0,
            isBossDead: false,

            /**
             * 战斗系统初始化 (载入存档或开启新关卡时调用)
             */
            initStage: function() {
                let stage = GameApp.State.Data.Progression.currentStage;
                let formula = GameApp.Data.Stage.Formula;
                
                // 计算当前关卡怪物血量
                this.currentEnemyMaxHp = Math.floor(formula.baseHp * Math.pow(formula.hpMult, stage - 1));
                
                // Boss 关卡血量特殊倍率
                if (stage % 10 === 0) {
                    this.currentEnemyMaxHp *= formula.bossMultiplier;
                }
                
                this.currentEnemyHp = this.currentEnemyMaxHp;
                this.isBossDead = false;

                // 通知 UI 更新怪物血条和关卡名称
                if (typeof GameApp.UI !== 'undefined') {
                    GameApp.UI.initCombatView();
                }
            },

            /**
             * 战斗心跳 (Tick)：由主引擎每隔固定时间调用
             * @param {number} deltaSeconds - 距离上次调用的真实时间差 (秒)
             */
            processTick: function(deltaSeconds) {
                if (this.isBossDead) return;

                let dps = GameApp.State.getTeamTotalDPS();
                if (dps <= 0) return; // 没有上阵式神

                // 加入微小的伤害波动 (90% - 110%)，让数字跳动更真实
                let fluctuation = GameApp.Utils.randomFloat(0.9, 1.1);
                let actualDamage = Math.floor(dps * deltaSeconds * fluctuation);

                // 偶尔触发暴击特效 (假暴击，仅为了爽感)
                let isCrit = Math.random() < 0.2; 
                if (isCrit) actualDamage = Math.floor(actualDamage * GameApp.Data.System.CRIT_BASE_MULTIPLIER);

                this.currentEnemyHp -= actualDamage;

                // 触发 UI 伤害飘字和血条扣减
                if (typeof GameApp.UI !== 'undefined') {
                    GameApp.UI.updateBossHpBar(this.currentEnemyHp, this.currentEnemyMaxHp);
                    GameApp.UI.spawnDamageText(actualDamage, isCrit);
                    GameApp.UI.triggerAttackAnim();
                }

                // 怪物死亡结算判定
                if (this.currentEnemyHp <= 0) {
                    this._handleEnemyDeath();
                }
            },

            /**
             * 内部私有方法：怪物死亡结算与掉落
             */
            _handleEnemyDeath: function() {
                this.isBossDead = true;
                let stage = GameApp.State.Data.Progression.currentStage;
                let formula = GameApp.Data.Stage.Formula;

                // 计算金币掉落
                let coinDrop = Math.floor(formula.baseCoin + (formula.coinStep * stage));
                if (stage % 10 === 0) coinDrop *= formula.bossMultiplier;

                // 发放奖励
                GameApp.State.modifyResource('coins', coinDrop);
                GameApp.State.modifyResource('jade', formula.baseJade); // 每关给微量勾玉
                GameApp.State.Data.Progression.totalKills++;

                console.log(`[Combat] 击破！关卡 ${stage} 通关。获得 ${coinDrop} 金币。`);

                // 推进关卡
                GameApp.State.Data.Progression.currentStage++;
                if (GameApp.State.Data.Progression.currentStage > GameApp.State.Data.Progression.highestStage) {
                    GameApp.State.Data.Progression.highestStage = GameApp.State.Data.Progression.currentStage;
                }

                // 延迟 0.5 秒进入下一关 (给玩家喘息和看死亡特效的时间)
                setTimeout(() => {
                    this.initStage();
                }, 500);
            }
        }
    };

    // [第五部分结束] 请在下方粘贴 [第六部分：引擎主循环与闭合] 的代码

    // ========================================================================
    // [第六部分：引擎主循环与闭合 (Engine & Boot Layer)]
    // 设计理念：游戏的心脏。负责统筹所有子系统的初始化顺序，
    // 维持稳定的帧率，计算真实的时间流逝(Delta-Time)，防范后台休眠导致的数值爆炸。
    // 额外附带：性能监控器与开发者调试工具 (DevTools)。
    // ========================================================================

    GameApp.Engine = {
        // --- 引擎运行状态 ---
        isRunning: false,
        lastFrameTime: 0,
        saveTimer: 0,         // 自动保存计时器
        tickTimer: 0,         // 逻辑心跳计时器
        
        // --- 性能监控 (FPS) ---
        framesThisSecond: 0,
        lastFpsTime: 0,
        currentFps: 60,

        /**
         * 1. 游戏引擎总点火 (Bootstrapper)
         * 严格控制各模块的启动顺序：存储读取 -> 数据计算 -> UI渲染 -> 开启循环
         */
        init: function() {
            console.log("[Engine] 正在启动 咸鱼阴阳师 核心引擎...");

            try {
                // 第一步：挂载本地存档
                GameApp.Storage.load();

                // 第二步：初始化战斗数值状态
                GameApp.Systems.Combat.initStage();

                // 第三步：启动 UI 渲染器
                GameApp.UI.init();

                // 第四步：点火，进入主循环
                this.lastFrameTime = performance.now();
                this.lastFpsTime = performance.now();
                this.isRunning = true;
                
                // 使用原生的 requestAnimationFrame 实现最高效的屏幕重绘同步
                requestAnimationFrame(this.loop.bind(this));
                
                console.log("[Engine] 引擎点火成功。游戏已开始运行。");
            } catch (error) {
                console.error("[Engine] 严重致命错误：引擎启动失败！", error);
                alert("游戏加载出错，可能是因为旧版存档数据不兼容。请在控制台输入 GameApp.Storage.hardReset() 重置游戏。");
            }
        },

        /**
         * 2. 游戏主循环 (The Game Loop)
         * 每一帧都会执行，负责计算时间差 (dt) 并驱动整个世界运转。
         */
        loop: function(now) {
            if (!this.isRunning) return;

            // --- A. 计算精确的时间差 (Delta Time) ---
            let dt = (now - this.lastFrameTime) / 1000; // 转换为秒
            this.lastFrameTime = now;

            // 【防休眠保护机制】
            // 当玩家把网页切到后台，浏览器会强行暂停 requestAnimationFrame。
            // 当玩家切回来时，dt 可能会变得极大（比如 3600 秒）。
            // 如果直接把 3600 塞进逻辑，会导致瞬间产生百万次计算卡死浏览器。
            // 因此，如果 dt 异常大（超过 0.5 秒），我们视为“挂机”，直接跳过此帧的细粒度计算。
            // (真实的离线收益已由 Storage.calculateOfflineProgress 接管)
            if (dt > 0.5) {
                console.warn(`[Engine] 检测到后台休眠或严重卡顿 (dt=${dt.toFixed(2)}s)。已触发引擎保护跳帧。`);
                requestAnimationFrame(this.loop.bind(this));
                return;
            }

            // --- B. 驱动业务系统 ---
            // 累加逻辑时间，控制心跳频率
            this.tickTimer += dt * 1000; 
            const tickRate = GameApp.Data.System.TICK_RATE_MS; // 100ms
            
            // 为了防止高帧率显示器（如 144Hz）导致游戏加速，使用固定步长(Fixed Update)模型
            while (this.tickTimer >= tickRate) {
                // 将毫秒转回秒传入 Combat 系统
                GameApp.Systems.Combat.processTick(tickRate / 1000);
                this.tickTimer -= tickRate;
            }

            // --- C. 自动存档系统 ---
            this.saveTimer += dt;
            if (this.saveTimer >= 10) { // 每 10 秒自动静默保存一次
                GameApp.Storage.save();
                this.saveTimer = 0;
            }

            // --- D. 性能监控仪 (FPS 计算) ---
            this.framesThisSecond++;
            if (now > this.lastFpsTime + 1000) {
                this.currentFps = Math.round((this.framesThisSecond * 1000) / (now - this.lastFpsTime));
                this.framesThisSecond = 0;
                this.lastFpsTime = now;
                // 你可以在控制台输入 GameApp.Engine.currentFps 查看当前帧率
            }

            // --- E. 循环递归 ---
            requestAnimationFrame(this.loop.bind(this));
        },

        // 暂停游戏（供特殊弹窗或切出时调用）
        pause: function() {
            this.isRunning = false;
            console.log("[Engine] 引擎已挂起。");
        },

        // 恢复游戏
        resume: function() {
            if (!this.isRunning) {
                this.lastFrameTime = performance.now();
                this.isRunning = true;
                requestAnimationFrame(this.loop.bind(this));
                console.log("[Engine] 引擎已恢复。");
            }
        }
    };

    // 1. 修复：离线收益算法中的变量指向
    GameApp.Storage.calculateOfflineProgress = function() {
        let now = Date.now();
        let lastTime = GameApp.State.Data.lastSaveTime;
        let diffSeconds = Math.floor((now - lastTime) / 1000);
        if (diffSeconds < 60) return;
        
        let maxSeconds = GameApp.Data.System.MAX_OFFLINE_HOURS * 3600;
        if (diffSeconds > maxSeconds) diffSeconds = maxSeconds;

        let teamDPS = GameApp.State.getTeamTotalDPS();
        if (teamDPS <= 0) return;

        let currentStage = GameApp.State.Data.Progression.currentStage;
        let formula = GameApp.Data.Stages.Formula; // 修复为 Stages.Formula
        
        let bossHp = formula.baseHp * Math.pow(formula.hpMult, currentStage - 1);
        if (currentStage % 10 === 0) bossHp *= formula.bossMultiplier;

        let timePerKill = Math.ceil(bossHp / teamDPS);
        if (timePerKill < 1) timePerKill = 1;
        let kills = Math.floor(diffSeconds / timePerKill);
        
        if (kills > 0) {
            let stageBaseCoin = formula.baseCoin + (formula.coinStep * currentStage);
            if (currentStage % 10 === 0) stageBaseCoin *= formula.bossMultiplier;
            
            let earnedCoins = Math.floor(kills * stageBaseCoin);
            GameApp.State.modifyResource('coins', earnedCoins);
            GameApp.State.Data.Progression.totalKills += kills;
            
            let hours = (diffSeconds / 3600).toFixed(1);
            setTimeout(() => {
                if (typeof GameApp.UI !== 'undefined' && GameApp.UI.showOfflineReport) {
                    GameApp.UI.showOfflineReport(hours, kills, earnedCoins);
                }
            }, 1000);
        }
    };

        if (stage % 10 === 0) this.currentEnemyMaxHp *= formula.bossMultiplier;

        this.isBossDead = false;

        if (typeof GameApp.UI !== 'undefined') GameApp.UI.initCombatView();

            <div style="width: 100%; display: flex; justify-content: center; margin-top: 100px;">

        setTimeout(() => {
            // 爆闪特效遮罩
            grid.innerHTML = `<div style="position:fixed; inset:0; background:${glowColor}; z-index:1000; animation: flashFadeOut 0.8s forwards; pointer-events:none;"></div>`;
            
            // 重新设置网格布局以排列卡牌
            grid.style.display = 'flex';
            grid.style.flexWrap = 'wrap';
            grid.style.justifyContent = 'center';
            grid.style.gap = '15px';
            grid.style.padding = '20px';
            grid.style.marginTop = '0';

            // 级联弹窗动画
            results.forEach((res, index) => {
                let sData = res.data;
                let newTag = res.isNew ? `<div class="gacha-card-new">NEW</div>` : '';
                
                let card = document.createElement('div');
                card.className = `gacha-card r-${sData.rarity}`;
                
                // 每张卡牌延迟 0.15 秒飞出，制造节奏感
                card.style.animationDelay = `${index * 0.15}s`; 
                card.style.opacity = '0';
                card.style.animationFillMode = 'forwards';
                
                card.innerHTML = `
                    ${newTag}
                    <div class="gacha-card-icon">${sData.icon}</div>
                    <div class="gacha-card-name">${sData.name}</div>
                `;
                grid.appendChild(card);
            });
            
            // 同步静默刷新其他界面数据
            GameApp.UI.updateResources();
            if (document.getElementById('view-roster').classList.contains('active')) {
                GameApp.UI.renderRoster();
            }
        }, 1200); // 1.2秒的画符前摇
    };
</script>
</body>
</html>
