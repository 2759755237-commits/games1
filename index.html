<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文明余烬 - 营地纪元</title>
    <style>
        :root {
            --bg: #121214; --panel: #1e1e24; --text: #d1d1d6;
            --accent: #e67e22; --danger: #e74c3c; --success: #2ecc71;
            --border: #333;
        }
        body {
            background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 20px; display: flex; justify-content: center; user-select: none;
        }
        #app { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 250px 1fr 300px; gap: 20px; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
        h2, h3 { color: var(--accent); margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .hidden { display: none !important; }
        
        button {
            background: #2a2a35; color: var(--text); border: 1px solid var(--border);
            padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 10px; text-align: left;
            transition: 0.2s; position: relative; overflow: hidden;
        }
        button:hover:not(:disabled) { background: #353542; border-color: var(--accent); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .cost { float: right; font-size: 0.85em; color: #888; }

        /* 营地视觉区 */
        #camp-visual {
            height: 200px; background: #0a0a0c; border: 2px dashed #333; border-radius: 8px;
            position: relative; margin-bottom: 20px; overflow: hidden;
        }
        #campfire {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 2rem; transition: transform 0.5s; text-shadow: 0 0 20px #e67e22;
        }
        .villager-icon { position: absolute; font-size: 1.5rem; transition: all 1s ease-in-out; }
        .building-icon { position: absolute; font-size: 1.8rem; }

        /* 村民列表 */
        .villager-card {
            background: #25252d; padding: 8px; border-radius: 4px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #555;
        }
        .v-name { font-weight: bold; }
        .v-status { font-size: 0.8em; color: #aaa; }
        
        /* 进度条 */
        .progress-container { width: 100%; height: 4px; background: #333; border-radius: 2px; margin-top: 5px; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s linear; }

        /* 日志 */
        #log { height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.9em; display: flex; flex-direction: column-reverse; }
        .log-entry { margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px dashed #333; }
        .log-time { color: #888; margin-right: 5px; }
    </style>
</head>
<body>

<div id="app">
    <div class="panel">
        <h2>仓库</h2>
        <div style="margin-bottom: 15px;">木材: <strong id="res-wood">0</strong></div>
        <div style="margin-bottom: 15px;">食物: <strong id="res-food">0</strong></div>
        <div style="margin-bottom: 15px;" class="hidden" id="res-stone-box">石头: <strong id="res-stone">0</strong></div>
        
        <h3 style="margin-top:20px;">基建</h3>
        <button onclick="buildFire()" id="btn-fire">
            点燃篝火 <span class="cost">10 木材</span>
        </button>
        <button onclick="buildTent()" id="btn-tent" class="hidden">
            搭建帐篷 <span class="cost">木材:<span id="cost-tent">20</span></span>
        </button>
    </div>

    <div class="panel">
        <h2>营地中心</h2>
        <div id="camp-visual">
            <div id="campfire" style="opacity: 0.2;">🪵</div>
            </div>

        <h3>行动指南</h3>
        <button onclick="gatherWood()">
            徒手捡柴 <span class="cost">+1 木材</span>
        </button>

        <div id="explore-system" class="hidden" style="margin-top: 15px;">
            <h3>派遣任务 (需指派空闲村民)</h3>
            <button id="btn-hunt" onclick="startExpedition('hunt')">
                🏹 派遣狩猎 (耗时 5秒)
                <div class="progress-container"><div id="prog-hunt" class="progress-bar"></div></div>
            </button>
            <button id="btn-mine" onclick="startExpedition('mine')" class="hidden">
                ⛏️ 探索石矿 (耗时 8秒)
                <div class="progress-container"><div id="prog-mine" class="progress-bar"></div></div>
            </button>
        </div>
    </div>

    <div class="panel">
        <h2>营地成员 (<span id="pop-current">0</span>/<span id="pop-max">0</span>)</h2>
        <div id="villager-list" style="min-height: 100px; margin-bottom: 20px;">
            <div style="color:#777; font-size:0.9em; text-align:center; padding:10px;">荒无人烟...</div>
        </div>

        <h2>营地日志</h2>
        <div id="log"></div>
    </div>
</div>

<script>
    // 词库与状态
    const NAMES = ["阿土", "飞鸟", "黑岩", "冬雨", "老木", "灰烬", "夜风", "残叶", "孤狼"];
    const state = {
        res: { wood: 0, food: 0, stone: 0 },
        popMax: 0,
        villagers: [], // { id, name, status, taskTime, taskMax }
        buildings: { tent: 0 },
        flags: { fireActive: false }
    };

    const visualCamp = document.getElementById('camp-visual');

    // 工具函数：获取可用村民
    function getIdleVillager() {
        return state.villagers.find(v => v.status === '空闲');
    }

    // 核心操作
    function gatherWood() {
        state.res.wood += 1;
        updateUI();
        if (state.res.wood === 1) log("你捡起了一根干树枝。这个地方太冷了。");
    }

    function buildFire() {
        if (state.res.wood >= 10 && !state.flags.fireActive) {
            state.res.wood -= 10;
            state.flags.fireActive = true;
            state.popMax = 1;
            
            // 视觉更新
            document.getElementById('btn-fire').classList.add('hidden');
            document.getElementById('campfire').innerHTML = '🔥';
            document.getElementById('campfire').style.opacity = '1';
            document.getElementById('btn-tent').classList.remove('hidden');
            document.getElementById('explore-system').classList.remove('hidden');
            
            log("篝火燃起。火光可能会吸引荒野中的流浪者。");
            spawnVillager(); // 第一个人必定马上来
            updateUI();
        }
    }

    function buildTent() {
        const cost = 20 + state.buildings.tent * 15;
        if (state.res.wood >= cost) {
            state.res.wood -= cost;
            state.buildings.tent += 1;
            state.popMax += 1;
            
            // 视觉渲染帐篷
            const tent = document.createElement('div');
            tent.className = 'building-icon';
            tent.innerHTML = '⛺';
            tent.style.left = `${10 + Math.random() * 80}%`;
            tent.style.top = `${10 + Math.random() * 80}%`;
            visualCamp.appendChild(tent);

            log("建好了一座简易帐篷。营地可以容纳更多人了。");
            updateUI();
        }
    }

    // 村民系统
    function spawnVillager() {
        if (state.villagers.length >= state.popMax) return;
        
        const name = NAMES[Math.floor(Math.random() * NAMES.length)];
        const v = {
            id: Date.now(),
            name: name,
            status: '空闲',
            emoji: '🧍',
            el: document.createElement('div')
        };
        
        // 初始化视觉元素
        v.el.className = 'villager-icon';
        v.el.innerHTML = v.emoji;
        moveVillagerVisual(v);
        visualCamp.appendChild(v.el);
        
        state.villagers.push(v);
        log(`<span style="color:var(--success)">${name} 加入了营地。</span>`);
        
        // 第一次有人的特殊解锁
        if (state.villagers.length === 1) {
            document.getElementById('btn-hunt').classList.remove('hidden');
        }
        updateUI();
    }

    function moveVillagerVisual(v) {
        if(v.status === '空闲') {
            // 在篝火附近闲逛
            v.el.style.left = `${40 + Math.random() * 20}%`;
            v.el.style.top = `${40 + Math.random() * 20}%`;
            v.el.style.opacity = '1';
        } else if (v.status.includes('外出')) {
            // 离开营地视线
            v.el.style.left = '110%';
            v.el.style.opacity = '0.2';
        }
    }

    // 派遣探索系统
    const tasks = {
        'hunt': { time: 5, name: '外出狩猎', log: '带着猎物回来了', res: 'food', min: 2, max: 5 },
        'mine': { time: 8, name: '探索石矿', log: '背回了沉重的石块', res: 'stone', min: 1, max: 3 }
    };

    function startExpedition(type) {
        const v = getIdleVillager();
        if (!v) {
            log(`<span style="color:var(--accent)">没有空闲的村民可以派遣！</span>`);
            return;
        }

        const taskInfo = tasks[type];
        v.status = taskInfo.name;
        v.taskMax = taskInfo.time;
        v.taskTime = taskInfo.time;
        
        moveVillagerVisual(v);
        log(`${v.name} 拿起简陋的武器，进入了黑森林...`);
        updateUI();
    }

    // 游戏主循环 (每秒执行 10 次，保证进度条平滑)
    setInterval(() => {
        const dt = 0.1;
        let uiNeedsUpdate = false;

        // 随机吸引村民
        if (state.flags.fireActive && state.villagers.length < state.popMax) {
            if (Math.random() < 0.005) { spawnVillager(); uiNeedsUpdate = true; }
        }

        // 村民随机走动 (仅限空闲的)
        state.villagers.forEach(v => {
            if (v.status === '空闲' && Math.random() < 0.05) moveVillagerVisual(v);
        });

        // 处理进行中的任务
        let huntProgress = 0, mineProgress = 0;
        
        state.villagers.forEach(v => {
            if (v.taskTime > 0) {
                v.taskTime -= dt;
                
                // 计算该任务的进度条
                const percent = (1 - v.taskTime / v.taskMax) * 100;
                if (v.status === '外出狩猎') huntProgress = Math.max(huntProgress, percent);
                if (v.status === '探索石矿') mineProgress = Math.max(mineProgress, percent);

                // 任务完成结算
                if (v.taskTime <= 0) {
                    v.taskTime = 0;
                    
                    // 结算收益
                    let taskKey = v.status === '外出狩猎' ? 'hunt' : 'mine';
                    let t = tasks[taskKey];
                    let gain = Math.floor(Math.random() * (t.max - t.min + 1)) + t.min;
                    
                    // 风险系统：10%概率受伤空手而归
                    if (Math.random() < 0.1) {
                        log(`<span style="color:var(--danger)">${v.name} 遭到了野兽袭击，受了点伤，空手逃回了营地。</span>`);
                    } else {
                        state.res[t.res] += gain;
                        log(`<span style="color:var(--success)">${v.name} ${t.log} (+${gain} ${t.res === 'food'?'食物':'石头'})。</span>`);
                        if(t.res === 'stone') document.getElementById('res-stone-box').classList.remove('hidden');
                        if(state.res.food >= 10) document.getElementById('btn-mine').classList.remove('hidden');
                    }
                    
                    v.status = '空闲';
                    moveVillagerVisual(v);
                    uiNeedsUpdate = true;
                }
            }
        });

        // 渲染进度条
        document.getElementById('prog-hunt').style.width = huntProgress + '%';
        document.getElementById('prog-mine').style.width = mineProgress + '%';

        if (uiNeedsUpdate) updateUI();

    }, 100);

    // UI 刷新
    function updateUI() {
        document.getElementById('res-wood').innerText = state.res.wood;
        document.getElementById('res-food').innerText = state.res.food;
        document.getElementById('res-stone').innerText = state.res.stone;
        
        document.getElementById('pop-current').innerText = state.villagers.length;
        document.getElementById('pop-max').innerText = state.popMax;
        document.getElementById('cost-tent').innerText = 20 + state.buildings.tent * 15;

        // 渲染村民列表
        const listEl = document.getElementById('villager-list');
        listEl.innerHTML = '';
        state.villagers.forEach(v => {
            const color = v.status === '空闲' ? '#2ecc71' : '#e67e22';
            listEl.innerHTML += `
                <div class="villager-card">
                    <span class="v-name">${v.emoji} ${v.name}</span>
                    <span class="v-status" style="color:${color}">${v.status}</span>
                </div>
            `;
        });
        
        // 按钮状态
        if(state.flags.fireActive) document.getElementById('btn-tent').disabled = state.res.wood < (20 + state.buildings.tent * 15);
    }

    function log(msg) {
        const container = document.getElementById('log');
        const d = new Date();
        const time = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
        container.innerHTML = `<div class="log-entry"><span class="log-time">[${time}]</span> ${msg}</div>` + container.innerHTML;
    }

    // 初始剧情
    log("醒来时，你的手几乎冻僵了。你需要马上收集一点木材生火。");
</script>
</body>
</html>
