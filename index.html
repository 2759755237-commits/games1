<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文明余烬 v5.0 - 黎明协议</title>
    <style>
        /* ================= 工业级 CSS 系统设计 ================= */
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;500;700&display=swap');

        :root {
            --bg-base: #050508;
            --bg-panel: rgba(18, 18, 26, 0.75);
            --bg-card: rgba(30, 30, 42, 0.6);
            --border-primary: rgba(80, 80, 120, 0.3);
            --border-glow: rgba(100, 200, 255, 0.4);
            
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            
            --theme-accent: #0ea5e9; /* 科幻蓝 */
            --theme-warn: #f59e0b;   /* 警告黄 */
            --theme-danger: #ef4444; /* 危险红 */
            --theme-success: #10b981;/* 安全绿 */
            --theme-mystic: #8b5cf6; /* 神秘紫 */

            --font-ui: 'Noto Sans SC', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --transition-fast: 0.15s ease;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.05), transparent 25%);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
        }

        /* 顶部仪表盘 (Header) */
        #header {
            height: 60px; background: var(--bg-panel); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-primary); display: flex; justify-content: space-between;
            align-items: center; padding: 0 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 100;
        }
        .sys-title { font-weight: 700; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 10px;}
        .sys-title::before { content: ''; display: block; width: 8px; height: 8px; background: var(--theme-warn); border-radius: 50%; box-shadow: 0 0 10px var(--theme-warn); }
        
        .global-stats { display: flex; gap: 20px; font-family: var(--font-mono); }
        .stat-pill { background: rgba(0,0,0,0.4); border: 1px solid var(--border-primary); padding: 6px 15px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 0.9rem;}
        .stat-pill i { font-style: normal; font-size: 1.1rem; }

        /* 主体网格布局 */
        #app-core { display: flex; flex: 1; overflow: hidden; padding: 20px; gap: 20px; }

        /* 左侧面板：物资与生态网络 */
        #panel-left { width: 320px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding-right: 5px;}
        .glass-panel { background: var(--bg-panel); backdrop-filter: blur(12px); border: 1px solid var(--border-primary); border-radius: 12px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .panel-title { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }

        /* 资源进度条组件 */
        .res-tracker { margin-bottom: 12px; }
        .res-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }
        .res-name { display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .res-val { font-family: var(--font-mono); }
        .res-rate { font-size: 0.75rem; font-family: var(--font-mono); text-align: right; margin-top: 2px;}
        .progress-track { width: 100%; height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .progress-fill { height: 100%; width: 0%; transition: width 0.3s ease; }
        .rate-pos { color: var(--theme-success); } .rate-neg { color: var(--theme-danger); }

        /* 中央面板：核心行动与建设 */
        #panel-center { flex: 1; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        
        /* 交互卡片设计 (重中之重) */
        .action-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .card-btn { 
            background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: 8px; padding: 15px; 
            cursor: pointer; text-align: left; transition: var(--transition-smooth); position: relative; overflow: hidden;
            display: flex; flex-direction: column; gap: 8px;
        }
        .card-btn::before { content:''; position:absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.03), transparent); transform: translateX(-100%); transition: 0.5s; }
        .card-btn:hover:not(:disabled) { border-color: var(--theme-accent); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.15); }
        .card-btn:hover:not(:disabled)::before { transform: translateX(100%); }
        .card-btn:active:not(:disabled) { transform: translateY(1px); }
        .card-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(80%); }
        
        .card-title { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .card-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; min-height: 35px;}
        .card-cost { font-family: var(--font-mono); font-size: 0.75rem; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; display: inline-flex; gap: 10px; flex-wrap: wrap;}
        .cost-item { display: flex; align-items: center; gap: 4px; }
        .cost-item.lack { color: var(--theme-danger); }

        /* 右侧面板：实体监控与日志 */
        #panel-right { width: 360px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        
        /* 村民监控模块 */
        .entity-list { display: flex; flex-direction: column; gap: 10px; }
        .entity-card { background: rgba(0,0,0,0.3); border-left: 3px solid var(--theme-accent); padding: 10px 12px; border-radius: 4px; border-top: 1px solid rgba(255,255,255,0.02); border-right: 1px solid rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.02); }
        .entity-card.dead { border-left-color: var(--theme-danger); opacity: 0.5; filter: grayscale(1); }
        .ent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .ent-name { font-weight: 700; font-size: 0.95rem; }
        .ent-job { font-size: 0.75rem; color: var(--theme-accent); background: rgba(14, 165, 233, 0.1); padding: 2px 6px; border-radius: 3px; }
        
        /* 精美下拉框 */
        select.ui-select { appearance: none; background: #000; color: #fff; border: 1px solid var(--border-primary); padding: 4px 8px; border-radius: 4px; font-family: var(--font-ui); font-size: 0.8rem; cursor: pointer; outline: none; width: 100%; transition: 0.2s;}
        select.ui-select:hover { border-color: var(--text-muted); }
        select.ui-select:focus { border-color: var(--theme-accent); box-shadow: 0 0 0 2px rgba(14,165,233,0.2); }

        /* 终端日志系统 */
        #terminal-log { background: #000; font-family: var(--font-mono); font-size: 0.75rem; padding: 15px; border-radius: 8px; border: 1px solid #1f2937; height: 250px; overflow-y: auto; display: flex; flex-direction: column-reverse; }
        .log-line { margin-bottom: 4px; line-height: 1.4; opacity: 0.9; animation: logIn 0.2s ease-out; }
        .log-time { color: #4b5563; margin-right: 8px; }
        .c-sys { color: var(--theme-accent); } .c-warn { color: var(--theme-warn); } .c-danger { color: var(--theme-danger); } .c-succ { color: var(--theme-success); }
        @keyframes logIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 0.9; transform: translateX(0); } }

        /* 屏幕飘字特效 (Floating Text) */
        .float-text { position: fixed; pointer-events: none; font-weight: 700; font-size: 1.2rem; font-family: var(--font-mono); animation: floatUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; z-index: 9999; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.8); opacity: 1; } 100% { transform: translateY(-60px) scale(1.2); opacity: 0; } }

        /* 控制面板显隐 */
        .locked-module { display: none !important; }
    </style>
</head>
<body>

    <div id="header">
        <div class="sys-title">协议节点 <span style="color:var(--text-muted);font-size:0.8rem;">v5.0.1</span></div>
        <div class="global-stats">
            <div class="stat-pill" title="系统运行天数"><i>⏳</i> Day <span id="ui-day">1</span></div>
            <div class="stat-pill" title="当前气候节律"><i>🌡️</i> <span id="ui-season">春季节律</span></div>
            <div class="stat-pill" title="营地可用人口/总容量"><i>👥</i> <span id="ui-pop">0</span> / <span id="ui-popmax">0</span></div>
            <div class="stat-pill" style="border-color:var(--theme-mystic);" title="解析的科技知识数据"><i>🧬</i> <span id="ui-tech">0</span> Data</div>
        </div>
        <div>
            <button class="ui-select" style="padding:6px 12px;" onclick="window.Engine.saveGame()">强制保存</button>
            <button class="ui-select" style="padding:6px 12px; color:var(--theme-danger); border-color:var(--theme-danger);" onclick="window.Engine.resetGame()">重置协议</button>
        </div>
    </div>

    <div id="app-core">
        
        <div id="panel-left">
            <div class="glass-panel">
                <div class="panel-title"><span>仓储网络</span> <span id="ui-maxres">CAP: 100</span></div>
                <div id="res-container">
                    </div>
            </div>
            
            <div class="glass-panel locked-module" id="module-climate">
                <div class="panel-title">生态压力</div>
                <div style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.5;">
                    当前季节对生存系统的干预：<br>
                    <span id="ui-season-desc" style="color: var(--text-main);">...</span>
                </div>
            </div>
        </div>

        <div id="panel-center">
            
            <div class="glass-panel">
                <div class="panel-title">手动干预指令</div>
                <div class="action-grid">
                    <button class="card-btn" onclick="window.Actions.manualGather(event)">
                        <div class="card-title">徒手拾荒</div>
                        <div class="card-desc">在附近搜集散落的生物质和碳基材料。</div>
                        <div class="card-cost"><span style="color:var(--theme-success);">+ 木材, 食物</span></div>
                    </button>
                </div>
            </div>

            <div class="glass-panel">
                <div class="panel-title">基础设施打印</div>
                <div class="action-grid" id="build-container">
                    </div>
            </div>

            <div class="glass-panel locked-module" id="module-tech">
                <div class="panel-title" style="border-bottom-color: var(--theme-mystic); color: var(--theme-mystic);">深层科技树解析</div>
                <div class="action-grid" id="tech-container">
                    </div>
            </div>

        </div>

        <div id="panel-right">
            <div class="glass-panel">
                <div class="panel-title">实体监控 <span id="ui-idle-pop" style="color:var(--theme-warn);">闲置: 0</span></div>
                <div class="entity-list" id="roster-container">
                    <div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 0.85rem;">休眠舱为空。建造基础保暖设施以唤醒实体。</div>
                </div>
            </div>

            <div class="glass-panel" style="padding: 10px;">
                <div class="panel-title" style="margin: 5px 5px 10px 5px;">终端日志</div>
                <div id="terminal-log"></div>
            </div>
        </div>

    </div>

<script>
/**
 * 文明余烬 v5.0 - 黎明协议 (Dawn Protocol Engine)
 * 工业级 JS 架构设计，彻底解决作用域和性能问题。
 */

// ================= 1. 核心配置与静态数据表 (DB) =================
const DB = {
    version: "5.0.1",
    resources: {
        'wood':  { name: '木材', color: '#8b5a2b' },
        'food':  { name: '有机食物', color: '#10b981' },
        'stone': { name: '石材矿物', color: '#94a3b8', locked: true }
    },
    seasons: [
        { id: 'spring', name: '春季复苏', desc: '气候温和。采集类工作效率 +20%。', modFood: 1.2, modWoodConsume: 0.5 },
        { id: 'summer', name: '夏季炎热', desc: '高温。基础消耗平稳。', modFood: 1.0, modWoodConsume: 0.2 },
        { id: 'autumn', name: '秋季丰收', desc: '最佳采集期！食物产出 +50%。准备过冬！', modFood: 1.5, modWoodConsume: 0.8 },
        { id: 'winter', name: '凛冬危机', desc: '极寒环境。有机物绝收，维生系统剧烈消耗木材！', modFood: 0.0, modWoodConsume: 4.0 }
    ],
    jobs: {
        'idle': { name: '休眠/闲置', res: null },
        'gatherer': { name: '采集者', res: 'food', rate: 1.2 },
        'woodcutter': { name: '伐木工', res: 'wood', rate: 1.5 },
        'miner': { name: '矿工', res: 'stone', rate: 0.8, reqTech: 'tools' },
        'scholar': { name: '解析者', res: 'knowledge', rate: 0.5, reqTech: 'language' } // 特殊产出科技点
    },
    buildings: {
        'campfire': { name: '基础生火装置', desc: '提供基础热源，是唤醒休眠实体的先决条件。', cost: { wood: 20 }, max: 1 },
        'tent': { name: '简易维生舱', desc: '扩展营地容量，允许容纳更多人口 (+2)。', cost: { wood: 40 }, mult: 1.5, popAdd: 2 },
        'storage': { name: '仓储扩容单元', desc: '将所有基础物资的存储上限提升 250。', cost: { wood: 120, stone: 50 }, mult: 1.8, reqTech: 'tools' },
    },
    techs: {
        'language': { name: '神经沟通协议', desc: '解锁"解析者"职业，开始产出深层科技 Data。', cost: { wood: 50, food: 80 } },
        'tools': { name: '基础工具矩阵', desc: '解锁"石材"资源开采与"仓储"建设。', cost: { knowledge: 30, wood: 150 }, req: 'language' }
    },
    names: ["Alpha-1", "Beta-X", "Nova-7", "Echo-V", "Zion-0", "Iris-9"]
};

// ================= 2. 响应式状态容器 (State) =================
// 我们构建一个纯数据对象，便于 JSON 序列化
let State = {
    v: DB.version,
    time: { tick: 0, day: 1, seasonIdx: 0, clock: 0 },
    res: { wood: 0, food: 0, stone: 0, knowledge: 0 },
    resMax: 100,
    popMax: 0,
    bld: { campfire: 0, tent: 0, storage: 0 },
    techs: {},
    entities: [],
    flags: { initialAwake: false }
};

// ================= 3. 核心游戏引擎 (Engine) =================
class GameEngine {
    constructor() {
        this.lastTime = performance.now();
        this.loopId = null;
        this.saveTimer = 0;
        this.netRates = { wood: 0, food: 0, stone: 0 }; // 缓存每秒净产出用于UI
    }

    init() {
        this.loadGame();
        Renderer.init();
        if (State.time.tick === 0) {
            Logger.log("系统启动... 协议载入成功。请搜集碳基材料建立热源。", "sys");
        }
        this.loop(); // 启动心跳
    }

    loop() {
        const now = performance.now();
        let dt = (now - this.lastTime) / 1000;
        this.lastTime = now;
        if (dt > 1) dt = 1; // 后台休眠防御

        // 1. 宏观时钟系统 (10秒=1天, 10天=1季)
        State.time.clock += dt;
        if (State.time.clock >= 10) {
            State.time.clock -= 10;
            State.time.day++;
            if (State.time.day > 10) {
                State.time.day = 1;
                State.time.seasonIdx = (State.time.seasonIdx + 1) % 4;
                Logger.log(`[生态警告] 进入 ${DB.seasons[State.time.seasonIdx].name}。`, "warn");
                Renderer.updateStaticUI();
            }
        }

        // 2. 消耗与生产结算
        let currentSeason = DB.seasons[State.time.seasonIdx];
        let alivePop = State.entities.filter(e => e.status === 'alive');
        
        // 基础消耗: 每人吃0.5, 篝火烧木头
        let consFood = alivePop.length * 0.5 * dt;
        let consWood = State.bld.campfire > 0 ? (1.5 * currentSeason.modWoodConsume * dt) : 0;
        
        let prodRates = { wood: 0, food: 0, stone: 0, knowledge: 0 };

        // 实体工作产出计算
        alivePop.forEach(e => {
            // 饥饿判定
            if (State.res.food < 1) {
                e.hunger -= 3 * dt;
                if(e.hunger <= 0) { e.hunger=0; e.hp -= 8 * dt; }
            } else {
                e.hunger += 10 * dt;
                if(e.hunger > 100) e.hunger = 100;
            }
            if (e.hp <= 0) this.killEntity(e, "因能源枯竭而宕机");

            // 产出
            if (e.job !== 'idle' && e.hp > 20 && e.hunger > 10) {
                let jobData = DB.jobs[e.job];
                let amount = jobData.rate * dt;
                if (jobData.res === 'food') amount *= currentSeason.modFood;
                prodRates[jobData.res] += amount;
            }
        });

        // 凛冬极寒无篝火惩罚
        if (State.time.seasonIdx === 3 && State.res.wood === 0 && State.bld.campfire > 0) {
            alivePop.forEach(e => { if(Math.random() < 0.2*dt) e.hp -= 15; });
        }

        // 应用数值与上限
        this.netRates.wood = (prodRates.wood - consWood) / dt;
        this.netRates.food = (prodRates.food - consFood) / dt;
        this.netRates.stone = prodRates.stone / dt;

        State.res.wood += prodRates.wood - consWood;
        State.res.food += prodRates.food - consFood;
        State.res.stone += prodRates.stone;
        State.res.knowledge += prodRates.knowledge;

        ['wood', 'food', 'stone'].forEach(r => {
            if (State.res[r] > State.resMax) State.res[r] = State.resMax;
            if (State.res[r] < 0) State.res[r] = 0;
        });

        // 人口自然繁衍/唤醒
        if (State.bld.campfire > 0 && alivePop.length < State.popMax && State.res.food > 20) {
            if (Math.random() < 0.03 * dt) this.spawnEntity();
        }

        // 自动保存 (每 10 秒)
        this.saveTimer += dt;
        if (this.saveTimer >= 10) { this.saveGame(true); this.saveTimer = 0; }

        State.time.tick++;
        Renderer.tickUpdate();

        this.loopId = requestAnimationFrame(() => this.loop());
    }

    recalcCaps() {
        State.popMax = (State.bld.campfire ? 2 : 0) + (State.bld.tent * DB.buildings.tent.popAdd);
        State.resMax = 100 + (State.bld.storage * 250);
        document.getElementById('ui-maxres').innerText = `CAP: ${State.resMax}`;
        document.getElementById('ui-popmax').innerText = State.popMax;
    }

    spawnEntity() {
        let name = DB.names[Math.floor(Math.random() * DB.names.length)] + "-" + Math.floor(Math.random()*99);
        State.entities.push({ id: Date.now(), name: name, hp: 100, hunger: 100, job: 'idle', status: 'alive' });
        Logger.log(`实体 [${name}] 已从休眠中唤醒接入网络。`, 'succ');
        Renderer.renderEntities();
    }

    killEntity(entity, reason) {
        entity.status = 'dead';
        entity.job = 'idle';
        entity.hp = 0;
        Logger.log(`[严重警报] 实体 ${entity.name} ${reason}。`, 'danger');
        Renderer.renderEntities();
    }

    // 存储管理
    saveGame(isAuto = false) {
        localStorage.setItem('civilization_embers_v5', JSON.stringify(State));
        if(!isAuto) Logger.log("协议数据已手动覆写至本地神经元。", "sys");
    }
    
    loadGame() {
        let data = localStorage.getItem('civilization_embers_v5');
        if (data) {
            try { 
                let parsed = JSON.parse(data); 
                if(parsed.v === DB.version) {
                    State = parsed;
                    Logger.log("检测到历史协议，网络已重连。", "sys");
                } else {
                    Logger.log("存档版本过期，已执行数据清理。", "warn");
                }
            } catch(e) { console.error("Save corrupted"); }
        }
        this.recalcCaps();
    }

    resetGame() {
        if(confirm("将永久抹除本地节点的所有进化数据！确认执行重置协议吗？")) {
            localStorage.removeItem('civilization_embers_v5');
            location.reload();
        }
    }
}

// ================= 4. 玩家操作交互 (Actions) =================
// 强制绑定到 window 确保 onClick 能访问
window.Actions = {
    manualGather(e) {
        let gainW = 1, gainF = 1;
        State.res.wood += gainW;
        State.res.food += gainF;
        
        // 视觉特效：点击飘字
        this.spawnFloatText(e.clientX, e.clientY, "+物资");
        Renderer.checkUnlocks();
        Renderer.tickUpdate();
    },

    build(bId) {
        let bData = DB.buildings[bId];
        let curr = State.bld[bId] || 0;
        
        // 扣除资源
        for (let r in bData.cost) {
            let cost = Math.floor(bData.cost[r] * Math.pow(bData.mult || 1, curr));
            State.res[r] -= cost;
        }
        
        State.bld[bId] = curr + 1;
        window.Engine.recalcCaps();
        
        if(bId === 'campfire' && !State.flags.initialAwake) {
            State.flags.initialAwake = true;
            Logger.log("热源网络已建立。生态气候监控模块已激活。", "succ");
            document.getElementById('module-climate').classList.remove('locked-module');
            window.Engine.spawnEntity();
            Renderer.checkUnlocks();
        } else {
            Logger.log(`节点建筑 [${bData.name}] 构建完成。`);
        }
        Renderer.renderBuildings();
    },

    research(tId) {
        let tData = DB.techs[tId];
        for(let r in tData.cost) { State.res[r] -= tData.cost[r]; }
        State.techs[tId] = true;
        Logger.log(`科研解析完成：[${tData.name}]！系统已升维。`, "mystic");
        
        if(tId === 'language') DB.resources.stone.locked = false;
        
        Renderer.checkUnlocks();
        Renderer.renderTechs();
        Renderer.renderEntities(); // 可能解锁了新职业下拉框
    },

    changeJob(eId, newJob) {
        let ent = State.entities.find(x => x.id === eId);
        if(ent && ent.status === 'alive') ent.job = newJob;
    },

    spawnFloatText(x, y, text) {
        let el = document.createElement('div');
        el.className = 'float-text';
        el.innerText = text;
        el.style.left = (x - 20 + Math.random()*40) + 'px';
        el.style.top = (y - 20) + 'px';
        el.style.color = 'var(--theme-accent)';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }
};

// ================= 5. DOM 渲染与 UI 控制 (Renderer) =================
const Renderer = {
    init() {
        this.renderResourceBars();
        this.updateStaticUI();
        this.renderBuildings();
        this.renderTechs();
        this.renderEntities();
        this.checkUnlocks();
    },

    // 高频更新（每帧）
    tickUpdate() {
        // 更新顶栏
        document.getElementById('ui-day').innerText = State.time.day;
        let alivePop = State.entities.filter(e => e.status === 'alive').length;
        document.getElementById('ui-pop').innerText = alivePop;
        document.getElementById('ui-tech').innerText = Math.floor(State.res.knowledge);
        
        let idlePop = State.entities.filter(e => e.status === 'alive' && e.job === 'idle').length;
        document.getElementById('ui-idle-pop').innerText = `闲置: ${idlePop}`;

        // 更新资源条
        ['wood', 'food', 'stone'].forEach(r => {
            if(DB.resources[r].locked && !State.techs['tools']) return; // 未解锁资源跳过
            let elVal = document.getElementById(`res-val-${r}`);
            let elFill = document.getElementById(`res-fill-${r}`);
            let elRate = document.getElementById(`res-rate-${r}`);
            if(elVal && elFill) {
                let current = State.res[r] || 0;
                elVal.innerText = `${Math.floor(current)}`;
                elFill.style.width = `${(current / State.resMax) * 100}%`;
                
                // 设置速率颜色
                let rate = window.Engine.netRates[r] || 0;
                elRate.innerText = `${rate >= 0 ? '+' : ''}${rate.toFixed(1)}/s`;
                elRate.className = `res-rate ${rate < 0 ? 'rate-neg' : (rate > 0 ? 'rate-pos' : '')}`;
            }
        });

        // 脏检查：更新按钮状态（不重新生成DOM，极大提高性能）
        this.updateBtnStates();
        
        // 更新实体血条
        State.entities.forEach(e => {
            let hpBar = document.getElementById(`hp-${e.id}`);
            if(hpBar) {
                hpBar.style.width = `${e.hp}%`;
                hpBar.style.background = e.hp < 30 ? 'var(--theme-danger)' : 'var(--theme-success)';
                document.getElementById(`hg-${e.id}`).style.width = `${e.hunger}%`;
                if(e.status === 'dead' && !hpBar.parentElement.parentElement.classList.contains('dead')) this.renderEntities();
            }
        });
    },

    updateStaticUI() {
        let s = DB.seasons[State.time.seasonIdx];
        document.getElementById('ui-season').innerText = s.name;
        document.getElementById('ui-season-desc').innerText = s.desc;
    },

    checkUnlocks() {
        if(State.bld.campfire > 0) {
            document.getElementById('module-climate').classList.remove('locked-module');
            document.getElementById('module-tech').classList.remove('locked-module');
        }
        if(State.techs['tools'] && document.getElementById('res-row-stone').classList.contains('locked-module')) {
            document.getElementById('res-row-stone').classList.remove('locked-module');
        }
    },

    // 动态生成资源进度条结构
    renderResourceBars() {
        let html = '';
        for(let r in DB.resources) {
            let rData = DB.resources[r];
            let isLocked = (r === 'stone' && !State.techs['tools']) ? 'locked-module' : '';
            html += `
                <div class="res-tracker ${isLocked}" id="res-row-${r}">
                    <div class="res-header">
                        <span class="res-name" style="color:${rData.color}">■ ${rData.name}</span>
                        <span class="res-val" id="res-val-${r}">0</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" id="res-fill-${r}" style="background:${rData.color}"></div></div>
                    <div class="res-rate" id="res-rate-${r}">+0.0/s</div>
                </div>
            `;
        }
        document.getElementById('res-container').innerHTML = html;
    },

    // 动态生成建筑卡片
    renderBuildings() {
        let html = '';
        for(let bId in DB.buildings) {
            let b = DB.buildings[bId];
            if(b.reqTech && !State.techs[b.reqTech]) continue;
            let curr = State.bld[bId] || 0;
            if(b.max && curr >= b.max) continue;

            let costHtml = '';
            for(let r in b.cost) {
                let costVal = Math.floor(b.cost[r] * Math.pow(b.mult || 1, curr));
                let rName = DB.resources[r].name;
                costHtml += `<span class="cost-item" data-res="${r}" data-val="${costVal}">${rName}:${costVal}</span>`;
            }

            html += `
                <button class="card-btn bld-btn" data-bid="${bId}" onclick="window.Actions.build('${bId}')">
                    <div class="card-title">${b.name} <span style="font-size:0.8rem;color:gray;float:right;">Lv.${curr}</span></div>
                    <div class="card-desc">${b.desc}</div>
                    <div class="card-cost">${costHtml}</div>
                </button>
            `;
        }
        document.getElementById('build-container').innerHTML = html;
    },

    // 动态生成科技卡片
    renderTechs() {
        let html = '';
        let hasVisibleTech = false;
        for(let tId in DB.techs) {
            let t = DB.techs[tId];
            if(State.techs[tId]) continue; // 隐藏已研究
            if(t.req && !State.techs[t.req]) continue; // 隐藏前置未完成
            
            hasVisibleTech = true;
            let costHtml = '';
            for(let r in t.cost) {
                let rName = r === 'knowledge' ? 'Data' : DB.resources[r].name;
                costHtml += `<span class="cost-item" data-res="${r}" data-val="${t.cost[r]}">${rName}:${t.cost[r]}</span>`;
            }

            html += `
                <button class="card-btn tech-btn" data-tid="${tId}" onclick="window.Actions.research('${tId}')" style="border-left: 3px solid var(--theme-mystic);">
                    <div class="card-title">${t.name}</div>
                    <div class="card-desc">${t.desc}</div>
                    <div class="card-cost">${costHtml}</div>
                </button>
            `;
        }
        if(!hasVisibleTech) html = '<div style="color:gray; font-size:0.8rem; padding:10px;">当前无可解析的数据块。</div>';
        document.getElementById('tech-container').innerHTML = html;
    },

    // 渲染实体卡片
    renderEntities() {
        let container = document.getElementById('roster-container');
        if(State.entities.length === 0) return;
        
        let html = '';
        State.entities.forEach(e => {
            let isDead = e.status === 'dead';
            
            // 构建可选职业
            let jobOpts = '';
            for(let jId in DB.jobs) {
                let j = DB.jobs[jId];
                if(j.reqTech && !State.techs[j.reqTech]) continue;
                jobOpts += `<option value="${jId}" ${e.job === jId ? 'selected':''}>${j.name}</option>`;
            }

            html += `
                <div class="entity-card ${isDead ? 'dead' : ''}">
                    <div class="ent-header">
                        <span class="ent-name">${isDead?'☠️':'👤'} ${e.name}</span>
                        <span class="ent-job">${isDead ? '离线' : DB.jobs[e.job].name}</span>
                    </div>
                    <div style="display:flex;gap:10px;margin-bottom:8px;">
                        <div style="flex:1;"><div style="font-size:10px;color:gray;margin-bottom:2px;">HP</div><div class="progress-track" style="height:4px;"><div id="hp-${e.id}" class="progress-fill" style="width:${e.hp}%; background:var(--theme-success);"></div></div></div>
                        <div style="flex:1;"><div style="font-size:10px;color:gray;margin-bottom:2px;">Energy</div><div class="progress-track" style="height:4px;"><div id="hg-${e.id}" class="progress-fill" style="width:${e.hunger}%; background:var(--theme-warn);"></div></div></div>
                    </div>
                    <select class="ui-select" onchange="window.Actions.changeJob(${e.id}, this.value)" ${isDead?'disabled':''}>
                        ${jobOpts}
                    </select>
                </div>
            `;
        });
        container.innerHTML = html;
    },

    // 精细化更新按钮状态 (性能优化核心)
    updateBtnStates() {
        document.querySelectorAll('.bld-btn, .tech-btn').forEach(btn => {
            let canAfford = true;
            btn.querySelectorAll('.cost-item').forEach(span => {
                let res = span.getAttribute('data-res');
                let reqVal = parseInt(span.getAttribute('data-val'));
                let currVal = State.res[res] || 0;
                if(currVal < reqVal) {
                    canAfford = false;
                    span.classList.add('lack');
                } else {
                    span.classList.remove('lack');
                }
            });
            btn.disabled = !canAfford;
        });
    }
};

// ================= 6. 终端日志系统 =================
const Logger = {
    log(msg, type = 'sys') {
        let box = document.getElementById('terminal-log');
        let d = new Date();
        let timeStr = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
        
        let el = document.createElement('div');
        el.className = `log-line c-${type}`;
        el.innerHTML = `<span class="log-time">[${timeStr}]</span> > ${msg}`;
        
        box.prepend(el);
        if(box.children.length > 30) box.removeChild(box.lastChild);
    }
};

// ================= 7. 系统启动 =================
window.Engine = new GameEngine();
window.onload = () => {
    window.Engine.init();
};

</script>
